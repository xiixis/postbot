# Запуск на сервере: бот и Caddy рядом.
#
# Caddy нужен не для красоты: Telegram открывает мини-приложение только по
# https с настоящим сертификатом. Caddy получает его сам у Let's Encrypt и
# продлевает без напоминаний, поэтому возиться с сертификатами не придётся
# ни разу.
services:
  bot:
    build: .
    restart: always
    # Все настройки бота — из .env (образец .env.example). Для контейнера там
    # обязательно: TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL, TELEGRAM_ADMIN_ID,
    # GEMINI_API_KEY, WEBAPP_URL=https://<WEBAPP_HOST>, DATABASE_URL (та же база,
    # что у мака), POSTBOT_TZ и вход Claude Code: CLAUDE_CODE_OAUTH_TOKEN
    # (`claude setup-token` на маке) — или один раз /login внутри, см. README.
    env_file: .env
    # Chromium раскладывает страницу в разделяемой памяти, а docker по
    # умолчанию даёт под неё 64 МБ. На карточке 2560x1440 этого не хватает.
    shm_size: "512m"
    # Том: база (если без Supabase), карточки, сессия Telegram (/data/ключи),
    # вход Claude Code (/data/claude), модель whisper (/data/hf).
    volumes:
      - data:/data
    expose:
      - "8137"

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on: [bot]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # адрес вида 1-2-3-4.sslip.io, подставляется из .env
      WEBAPP_HOST: ${WEBAPP_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

# Имена томов только латиницей: docker compose кириллицу в них не принимает.
volumes:
  data:
  caddy_data:
  caddy_config:
