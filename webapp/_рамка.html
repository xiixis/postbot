<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рамка телефона для снимков</title>
<style>
  html,body{margin:0;padding:0;background:#0f0f0f}
  iframe{display:block;width:390px;height:844px;border:0}
</style>
</head>
<body>
<!--
  Зачем рамка. Безголовый Chrome не открывает окно уже 500 CSS-пикселей — это
  его нижний предел, и «--window-size=390» он молча игнорирует. Страница при
  этом верстается на 500, а снимок обрезается до 390: получается картинка, на
  которой всё будто вылезает за край, хотя вёрстка цела. Ровно на этом можно
  полдня чинить несуществующую беду.

  Внутри рамки окно настоящее: 390 пикселей, медиазапросы срабатывают так же,
  как на телефоне. Файл начинается с подчёркивания и в сборку не уезжает.
-->
<iframe id="телефон" title="Приложение"></iframe>
<script src="_рамка.js"></script>
</body>
</html>
