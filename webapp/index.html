<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f0f0f">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Редактор 4xTube</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <img src="/logo.png" alt="" width="28" height="28">
  <div class="name">Редактор</div>
  <button class="ch" id="mac" title="Состояние мака"></button>
  <button class="ch" id="ch"></button>
  <button class="gear" id="звук" title="Звук уведомлений"
          aria-label="Звук уведомлений">🔔</button>
  <button class="gear" id="gear" title="Настройки"
          aria-label="Настройки">⚙️</button>
</header>

<div id="путь" hidden></div>

<div id="ход" hidden></div>
<div id="view"></div>

<nav class="низ" aria-label="Разделы приложения">
  <button data-раздел="today" aria-label="Сегодня: что с фабрикой сейчас">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="8" width="19" height="8" rx="2"/>
      <path d="M8.8 8v8M15.2 8v8"/>
    </svg>
    <span class="под">Сегодня</span>
  </button>
  <button data-раздел="plan" aria-label="План: что выйдет дальше">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="5" width="18" height="16" rx="2"/>
      <path d="M8 3v4M16 3v4M3 10h18"/>
    </svg>
    <span class="под">План</span>
  </button>
  <button data-раздел="out" aria-label="Вышло: история публикаций и числа">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3.5v10M12 3.5 8.5 7M12 3.5 15.5 7"/>
      <path d="M4.5 13.5V18a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4.5"/>
    </svg>
    <span class="под">Вышло</span>
  </button>
  <button data-раздел="stock" aria-label="Сырьё: идеи и факты о проекте">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0-3.4 10.9c.6.5 1 1.2 1 2h4.8c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/>
      <path d="M9.6 18.6h4.8M10.8 21.2h2.4"/>
    </svg>
    <span class="под">Сырьё</span>
  </button>
</nav>

<script src="core.js"></script>
<script src="sheets.js"></script>
<script src="screens.js"></script>
<script src="app.js"></script>
</body>
</html>
