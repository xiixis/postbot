<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f0f0f">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Редактор 4xTube</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Палитра и шкала взяты из приложения 4xTube: те же переменные, те же
   скругления и та же кривая движения. Мини-приложение должно читаться как
   его продолжение, а не как отдельный сайт. */
:root{
  --bg:#0f0f0f; --surface:#171717; --surface-2:#1f1f1f; --surface-3:#2b2b2b;
  --border:#2e2e2e; --border-strong:#454545;
  --text:#f2f2f0; --muted:#8d8d87;
  --accent:#c6ff34; --accent-hover:#d3ff5e; --accent-soft:#2b3a0d; --on-accent:#171717;
  --violet:#a78bfa; --danger:#ff6b6b; --warn:#ffb648;
  --radius:.5rem; --radius-sm:.25rem;
  --shadow:0 8px 26px rgba(0,0,0,.7); --shadow-soft:0 2px 8px rgba(0,0,0,.4);
  --dur-micro:.2s; --dur-swap:.3s;
  --плавно:transform .2s var(--ease-out),background-color .2s var(--ease-out),
           border-color .2s var(--ease-out),color .2s var(--ease-out),
           opacity .2s var(--ease-out);
  --ease-out:cubic-bezier(.05,.7,.1,1);
  --press:scale(.97);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
button,.вещь,.ячейка,.станок,.нстр,.сырьёкн div{touch-action:manipulation}
/* Корень 16, а не 14. При 14 вся вторая ступень шкалы уходила ниже
   двенадцати пикселей — предела, за которым текст на телефоне уже не
   читают, а разбирают. Шкала осталась та же, просто вся крупнее. */
html{font-size:clamp(16px,.25vw+14.8px,18px)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:.875rem/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:calc(var(--верх, 0px)) 1rem
          calc(1.25rem + var(--низ, env(safe-area-inset-bottom)));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
/* Обводка фокуса. Её не было вовсе: человек с клавиатурой не видел, где
   находится. Только focus-visible — мышью она не мешает. */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;
  border-radius:var(--radius-sm)}

/* ── шапка ───────────────────────────────────────────────────────────── */
header{display:flex;align-items:center;gap:.625rem;padding:1rem 0 .875rem;
  min-width:0}
header img{width:1.75rem;height:1.75rem;display:block}
header .name{font-weight:700;letter-spacing:-.01em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header #mac{margin-left:auto;font-size:.75rem;padding:.3125rem .625rem;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  color:var(--muted)}
header #mac.off{border-color:var(--warn);color:var(--warn)}
header #mac{flex:0 0 auto}
@media (max-width:30rem){header #mac .слово{display:none}}
header .ch{color:var(--muted);font-size:.75rem;min-width:0;flex:0 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:.3125rem .625rem;transition:var(--плавно)}
header .ch:active{transform:var(--press)}
/* основной канал подсвечен: это канал на десять тысяч человек, и то, что
   пишем сейчас именно туда, должно читаться с одного взгляда */
header .ch.main{color:var(--accent);border-color:var(--accent);
  background:var(--accent-soft)}
.pick{display:flex;align-items:center;gap:.625rem;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius);padding:.75rem;margin-bottom:.5rem;
  transition:var(--плавно)}
.pick:active{transform:var(--press)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .галка{width:1.25rem;color:var(--accent)}
.pick .низ{font-size:.75rem;color:var(--muted)}

/* ── цех ─────────────────────────────────────────────────────────────
   Главное в приложении не пост, а машина, которая их делает. При пяти
   публикациях в день отдельный пост перестаёт быть событием: важнее,
   работает ли станок, чем он занят и не кончилось ли сырьё. Поэтому
   верхний экран это станки, а посты живут внутри них. */
/* Когда главную кнопку рисует телеграм, наша такая же в вёрстке лишняя:
   одно действие не должно быть на экране дважды. */
body[data-родная="да"] #создать,
body[data-родная="да"] #дособрать,
body[data-родная="да"] [data-забрать]{display:none}
.назад{background:transparent;border:0;color:var(--muted);font-size:.8125rem;
  padding:.75rem 0 .5rem;display:flex;align-items:center;gap:.375rem;
  transition:var(--плавно)}
.назад:active{transform:var(--press)}
.lbl.свер{margin-top:1.25rem}
.сводка{display:flex;align-items:center;gap:.625rem;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:.75rem;
  margin-bottom:.75rem}
.сводка .кол{flex:1;min-width:0;text-align:center}
.сводка b{display:block;font-size:1.375rem;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.сводка span{display:block;font-size:.6875rem;color:var(--muted);
  line-height:1.3;margin-top:.1875rem}
.сводка .раз{width:1px;align-self:stretch;background:var(--border);flex:0 0 auto}
.сводка b.тревога{color:var(--warn)}

.станок{background:var(--surface);border:1px solid var(--border);
  border-radius:.75rem;padding:.875rem;margin-bottom:.625rem;
  transition:var(--плавно)}
.станок.спит{opacity:.62}
.станок.работает{border-color:var(--accent)}
.станок.встал{border-color:var(--danger)}
.станок.обесточен{border-color:var(--warn)}
.сост-станка{display:flex;align-items:flex-start;gap:.625rem;margin-top:.75rem;
  padding-top:.75rem;border-top:1px solid var(--border)}
.сост-станка .зн{font-size:1.125rem;flex:0 0 auto;line-height:1.2}
.сост-станка b{display:block;font-weight:600;font-size:.8125rem}
.сост-станка span{color:var(--muted);font-size:.6875rem;line-height:1.4;
  overflow-wrap:anywhere}
.станок.работает .сост-станка b{color:var(--accent)}
.станок.встал .сост-станка b{color:var(--danger)}
.станок.обесточен .сост-станка b{color:var(--warn)}
.станок .вещь .час{flex:0 0 auto;font-size:.6875rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
.станок .вещь.ждут .т{color:var(--warn)}
.станок:active{transform:var(--press)}
.станок .гол{display:flex;align-items:center;gap:.6875rem}
.станок .гол .зн{font-size:1.375rem;flex:0 0 auto}
.станок .гол b{font-size:.875rem;font-weight:700}
.станок .гол .низ{font-size:.6875rem;color:var(--muted);margin-top:.125rem;
  line-height:1.35}
/* Тумблер, а не кнопка: у автопилота два состояния, и они должны читаться
   без нажатия. */
.тумблер{margin-left:auto;width:2.875rem;height:1.625rem;border-radius:999px;
  background:var(--surface-3);border:1px solid var(--border-strong);
  position:relative;flex:0 0 auto;transition:var(--плавно)}
/* Сам тумблер должен остаться тумблером по виду, поэтому область нажатия
   растим невидимо — до нормы в 44 точки. */
.тумблер::after{content:"";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);width:2.875rem;height:2.75rem}
.тумблер i{position:absolute;top:.125rem;left:.125rem;width:1.25rem;height:1.25rem;
  border-radius:50%;background:var(--muted);display:block;transition:var(--плавно)}
.тумблер.on{background:var(--accent-soft);border-color:var(--accent)}
.тумблер.on i{left:auto;right:.125rem;background:var(--accent)}
/* Шкала это топливо станка: сколько вышло, сколько готово ждать и сколько
   ячеек пустует. Пустая ячейка — работа, а не отсутствие. */
.шкала{display:flex;gap:.25rem;margin-top:.8125rem}
.шкала span{flex:1;height:.5625rem;border-radius:.1875rem;background:var(--surface-3)}
.шкала span.вышло{background:var(--border-strong)}
.шкала span.готов{background:var(--accent)}
/* Ячейка, над которой станок работает прямо сейчас. Заливка ползёт слева
   направо — это и есть индикатор, отдельной полоски не нужно. */
.шкала span.идёт{background:linear-gradient(90deg,var(--accent) 50%,
  var(--surface-3) 50%);background-size:200% 100%;
  animation:наполняется 1.6s linear infinite}
@keyframes наполняется{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){
  .шкала span.идёт{animation:none;background:var(--accent-soft)}}
.подшкала{display:flex;margin-top:.5rem;font-size:.6875rem;color:var(--muted);
  gap:.5rem}
.подшкала b{color:var(--text);font-weight:600}
.подшкала span:last-child{margin-left:auto;text-align:right}
.станок .вещь{display:flex;align-items:center;gap:.5625rem;padding:.5625rem 0;
  border-top:1px solid var(--border);font-size:.8125rem}
.станок .вещь img{width:1.75rem;aspect-ratio:3/4;object-fit:cover;
  object-position:top;border-radius:var(--radius-sm);flex:0 0 auto;
  background:var(--surface-2)}
.станок .вещь .т{flex:1;min-width:0;line-height:1.3;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.станок .вещь .сост{flex:0 0 auto;font-size:.6875rem;color:var(--accent)}
.внутрь{display:flex;align-items:center;justify-content:center;gap:.375rem;
  color:var(--muted);font-size:.6875rem;padding-top:.6875rem;
  border-top:1px solid var(--border);margin-top:.125rem}

/* Ячейка смены. Час слева — это адрес поста в дне. */
.ячейка{display:flex;align-items:center;gap:.5625rem;padding:.625rem;
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);margin-bottom:.375rem;transition:var(--плавно)}
.ячейка:active{transform:var(--press)}
.ячейка .час{font-size:.8125rem;font-variant-numeric:tabular-nums;
  width:2.625rem;flex:0 0 auto;color:var(--accent)}
.ячейка.прошла .час{color:var(--muted)}
.ячейка img{width:1.875rem;aspect-ratio:3/4;object-fit:cover;object-position:top;
  border-radius:var(--radius-sm);flex:0 0 auto;background:var(--surface-2)}
.ячейка .т{flex:1;min-width:0;font-size:.8125rem;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ячейка .сост{flex:0 0 auto;font-size:.6875rem;color:var(--muted)}
.ячейка .сост.готов{color:var(--accent)}
.ячейка.пуста{border-style:dashed;border-color:var(--border-strong);
  background:transparent;justify-content:center;color:var(--muted);
  font-size:.8125rem;padding:.8125rem}
.ячейка.пуста.прошла{opacity:.45;border-color:var(--border)}

/* Пост, который ждёт одобрения. Он показан не как ячейка: у него нет
   часа, и притворяться частью смены он не должен. */
.карточка-ждёт{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:.625rem;margin-bottom:.5rem}
.карточка-ждёт .верхушка{display:flex;align-items:center;gap:.625rem;
  transition:var(--плавно)}
.карточка-ждёт .верхушка:active{transform:var(--press)}
.карточка-ждёт img{border-radius:var(--radius-sm);object-fit:cover;
  object-position:top;flex:0 0 auto;background:var(--surface-2)}
.карточка-ждёт .т{flex:1;min-width:0;font-size:.8125rem;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.карточка-ждёт .стр{color:var(--border-strong);flex:0 0 auto}
.часы-выбор{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:.625rem;
  padding-top:.625rem;border-top:1px solid var(--border)}
.часы-выбор button{border:1px solid var(--border-strong);background:transparent;
  color:var(--text);border-radius:999px;height:2.25rem;padding:0 .875rem;
  font-size:.75rem;font-variant-numeric:tabular-nums;transition:var(--плавно)}
.часы-выбор button:active{transform:var(--press);background:var(--accent-soft);
  border-color:var(--accent);color:var(--accent)}
.ячейка .сост.одобрен{color:var(--accent)}
/* Номер поста. Он же в чате бота, в логе и в ошибках, и без него owner не
   может сказать «поправь 71»: заголовки у похожих постов совпадают. */
.номер{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;
  margin-right:.15rem}

.нстр{display:flex;align-items:center;gap:.625rem;padding:.75rem;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-bottom:.375rem;font-size:.8125rem;
  transition:var(--плавно)}
.нстр:active{transform:var(--press)}
.нстр .знч{margin-left:auto;color:var(--accent);font-size:.6875rem;
  text-align:right}
.нстр .стр{color:var(--border-strong)}

.сырьёкн{display:flex;gap:.5rem}
.сырьёкн div{flex:1;background:var(--surface);border:1px solid var(--border);
  border-radius:.5625rem;padding:.6875rem;font-size:.6875rem;color:var(--muted);
  line-height:1.35;transition:var(--плавно)}
.сырьёкн div:active{transform:var(--press)}
.сырьёкн b{display:block;color:var(--text);font-size:.8125rem;font-weight:600;
  margin-bottom:.125rem}

/* Заказ. Первым спрашивается количество: при пяти публикациях в день это
   и есть настоящий вопрос, а «про что» станок решит сам. */
.счётчик{display:flex;align-items:center;gap:.875rem;background:var(--surface);
  border:1px solid var(--border);border-radius:.75rem;padding:1rem;
  margin-bottom:.75rem}
.счётчик button{width:3rem;height:3rem;border-radius:999px;
  border:1px solid var(--border-strong);background:transparent;color:var(--text);
  font-size:1.25rem;flex:0 0 auto;transition:var(--плавно)}
.счётчик button:active:not(:disabled){transform:var(--press)}
.счётчик button:disabled{opacity:.3}
.счётчик .ч{flex:1;text-align:center;min-width:0}
.счётчик .ч b{display:block;font-size:2.125rem;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.счётчик .ч span{font-size:.6875rem;color:var(--muted);display:block;
  margin-top:.25rem}
.станки{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.станки button{border:1px solid var(--border);background:var(--surface);
  border-radius:.5625rem;padding:.75rem;font-size:.8125rem;line-height:1.3;
  text-align:left;color:var(--text);transition:var(--плавно)}
.станки button b{display:block;font-weight:600;margin-bottom:.125rem}
.станки button span{color:var(--muted);font-size:.6875rem}
.станки button.on{border-color:var(--accent);background:var(--accent-soft)}
.станки button.on b{color:var(--accent)}
.ячч{display:flex;flex-wrap:wrap;gap:.375rem}
.ячч button{border:1px solid var(--border);background:var(--surface);
  border-radius:999px;padding:.5rem .75rem;font-size:.6875rem;color:var(--muted);
  font-variant-numeric:tabular-nums;transition:var(--плавно)}
.ячч button.on{border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent)}
.ячч button:active{transform:var(--press)}

.часы-станка{display:flex;flex-wrap:wrap;gap:.375rem}
.часы-станка span{border:1px solid var(--accent);background:var(--accent-soft);
  color:var(--accent);border-radius:999px;padding:.5rem .75rem;font-size:.6875rem;
  font-variant-numeric:tabular-nums}
.часы-станка span.плюс{border-color:var(--border-strong);background:transparent;
  color:var(--muted)}

.углы{display:flex;flex-wrap:wrap;gap:.375rem}
.углы span{border:1px solid var(--border);background:var(--surface);
  border-radius:999px;padding:.5rem .75rem;font-size:.6875rem;color:var(--muted)}
.углы span.on{border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft)}
.углы span.был{opacity:.4}

/* ── вкладки ─────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:.25rem;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:.25rem;margin-bottom:1rem}
.tabs button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);
  border-radius:999px;padding:.5rem;font-size:.8125rem;font-weight:600;
  transition:var(--плавно)}
.tabs button.on{background:var(--surface-3);color:var(--text)}
.tabs button:active{transform:var(--press)}
.tabs .dot[hidden]{display:none}
.tabs .dot{display:inline-block;min-width:1.25rem;margin-left:.25rem;
  font-size:.6875rem;color:var(--on-accent);background:var(--accent);
  border-radius:999px;padding:0 .3rem}

/* ── общие блоки ─────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:.875rem;box-shadow:var(--shadow-soft)}
.card + .card{margin-top:.625rem}
.lbl{font-size:.75rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:1.25rem 0 .5rem}
.lbl:first-child{margin-top:0}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:2.5rem 1rem;line-height:1.6}
.empty b{display:block;color:var(--text);margin-bottom:.25rem}

.stats{display:flex;gap:.5rem;margin-top:.75rem}
/* min-width:0 обязателен: без него колонка не даёт себя сжать, и длинное
   слово распирает строку вместо переноса. */
.stats div{flex:1 1 0;min-width:0;background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);padding:.625rem;text-align:center;
  font-size:.6875rem;color:var(--muted);overflow-wrap:anywhere}

/* Факты это не числа, а предложения разной длины. В плитках со «сводкой» они
   ломали строку: там крупный жирный текст по центру, рассчитанный на «165$»,
   а приходит «перестали использовать, аватаров в роликах нет». */
/* Справка о проекте: один список, а не девять карточек. Правило «.факты div»
   цепляло и вложенные подпись со значением, поэтому каждый факт рисовался
   рамкой внутри рамки и блок съедал половину экрана. */
.факты{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-top:.75rem;overflow:hidden}
.факты>div{padding:.5rem .75rem;min-width:0}
.факты>div+div{border-top:1px solid var(--border)}
.факты .к{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.125rem}
.факты .з{font-size:.8125rem;line-height:1.35;color:var(--text);
  overflow-wrap:anywhere}
.stats b{display:block;font-size:1.125rem;color:var(--text);font-weight:700;
  line-height:1.2;font-variant-numeric:tabular-nums}

.идея{display:flex;gap:.375rem;margin-bottom:.375rem}
.идея .взять{flex:1;text-align:left;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:.625rem .75rem;
  font-size:.8125rem;line-height:1.35;transition:var(--плавно)}
.идея .взять:active{transform:var(--press)}
.идея .выкинуть{background:transparent;border:1px solid var(--border);color:var(--muted);
  border-radius:var(--radius);padding:0 .625rem;font-size:.75rem}

.chips{display:flex;flex-wrap:wrap;gap:.375rem}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:.4375rem .875rem;font-size:.8125rem;
  transition:var(--плавно)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:active{transform:var(--press)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:999px;padding:.625rem 1.25rem;font-size:.8125rem;
  transition:var(--плавно);box-shadow:var(--shadow-soft)}
.btn:active:not(:disabled){transform:var(--press)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:600}
.btn.wide{width:100%;padding:.8125rem}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.danger{color:var(--danger);border-color:var(--border)}
.row{display:flex;gap:.5rem}
.row .btn{flex:1}

/* ── пост ────────────────────────────────────────────────────────────── */
.shot{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius);
  border:1px solid var(--border);display:block;background:var(--surface-2)}
/* Карточка очереди. Одна карточка это одно решение: что за пост, куда он
   поедет и что с ним сделать. Всё, что не помогает решить, ушло на вкладку
   «Ещё»: раньше первый экран показывал разом план, цифры, копилку, факты,
   рубрики и пять кнопок, и глазу не за что было зацепиться. */
/* Превью крупнее: пост узнаётся по картинке быстрее, чем по заголовку,
   а она была самым мелким элементом карточки. */
/* Единственный акцент на карточке. Раньше зелёными были все кнопки подряд,
   на экран приходилось пять зелёных полос, и глазу не за что было зацепиться. */

/* Адреса одной строкой: выбранные подписаны, остальные значком. Четыре
   кнопки в две строки занимали столько же места, сколько само решение, и
   повторялись у каждого поста. Остальное — время, правка, убрать — ушло
   под «⋯»: было восемь кнопок на карточку и сорок на экран. */

/* Полоска хода. Генерация идёт минутами, и человек за это время сворачивает
   приложение. Вернувшись, он должен увидеть, что работа идёт, на любом
   экране, а не только в листе, из которого её запустил. */
.полоска{display:flex;align-items:center;gap:.625rem;background:var(--surface);
  border:1px solid var(--accent);border-radius:var(--radius);
  padding:.75rem .875rem;margin-bottom:.625rem}
.полоска .что{font-weight:600;font-size:.8125rem}
.полоска .этап{margin-left:auto;color:var(--muted);font-size:.75rem;
  text-align:right;overflow-wrap:anywhere}

/* Пачка. Пять постов в день в TikTok одобряются не по одному — это главная
   ежедневная работа, и у неё должна быть своя строка. */
.строчка{display:flex;gap:.625rem;align-items:baseline;font-size:.8125rem;
  padding:.5rem 0;border-top:1px solid var(--border);line-height:1.35}
.строчка span{margin-left:auto;flex:0 0 auto;color:var(--muted);font-size:.75rem}
/* Создание переехало наверх: это второе по частоте действие после
   одобрения, а внизу его приходилось искать под всей лентой. */
#создать{border-color:var(--border-strong);background:transparent;
  height:3.5rem;margin-bottom:1rem}
.пусто{text-align:center;color:var(--muted);padding:2.5rem 1rem;line-height:1.5}
.пусто b{display:block;color:var(--text);font-size:1rem;margin-bottom:.375rem}

/* Куда поедет пост. Ряд переключателей прямо на карточке: раньше выбрать
   площадку можно было только кнопками в чате бота. */
/* Ровно две колонки, а не перенос: при переносе четвёртая площадка вставала
   одна во всю ширину и выглядела как отдельная кнопка. */
.куда{display:grid;grid-template-columns:1fr 1fr;gap:.375rem;margin-top:.375rem}
.куда button{min-width:0;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted);border-radius:var(--radius);
  padding:.4375rem .5rem;font-size:.75rem;transition:var(--плавно);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.куда button.on{border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft)}
.куда button.серая{opacity:.45}
.куда button:active{transform:var(--press)}
.аккаунт{display:flex;align-items:center;gap:.75rem}
.кружок{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;
  place-items:center;font-size:1.35rem;background:var(--surface-3);
  border:1px solid var(--border);flex:0 0 auto}
.ттпост{margin-top:.5rem}
.ттпост .t{margin:.5rem 0 .625rem;font-weight:600}
.лента.малая img{width:32%}
/* Карусель листается пальцем и прилипает к слайду: так же, как в телеграме */
.лента{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;padding-bottom:.375rem;margin:0 -1px}
.лента::-webkit-scrollbar{height:0}
.лента img{width:74%;flex:0 0 auto;aspect-ratio:1;object-fit:cover;
  scroll-snap-align:center;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--surface-2)}
.лента img:only-child{width:100%}
.счётслайдов{font-size:.75rem;color:var(--muted);margin-top:.375rem;text-align:center}
.post{margin-top:.75rem;white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.post b{font-weight:700}
.post code{background:var(--surface-3);border-radius:var(--radius-sm);
  padding:.0625rem .3125rem;font-size:.8125em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.post blockquote{margin:.5rem 0;padding:.125rem 0 .125rem .75rem;
  border-left:2px solid var(--accent);color:var(--text)}
.post a{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:.375rem;align-items:center;
  font-size:.75rem;color:var(--muted)}
.tag{background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:.125rem .5rem}
.tag.when{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag.done{color:var(--muted)}

/* строка расписания */
.line{display:flex;gap:.75rem;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius);padding:.75rem;transition:var(--плавно)}
.line:active{transform:var(--press)}
.line img{width:4.5rem;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius-sm);
  flex:0 0 auto;background:var(--surface-2)}
.line .t{font-size:.8125rem;line-height:1.35;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line .w{font-size:.6875rem;color:var(--accent);margin-top:.25rem}
.line .w.past{color:var(--muted)}
.сам{color:var(--muted);font-weight:400}
.охват{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:.375rem}

/* ── работа ──────────────────────────────────────────────────────────── */
.work{display:flex;flex-direction:column;gap:.625rem;padding:1.5rem .875rem}
.step{display:flex;align-items:center;gap:.625rem;color:var(--muted);
  font-size:.8125rem;transition:var(--dur-swap)}
.step.on{color:var(--text)}
.step.done{color:var(--muted)}
.spin{width:.875rem;height:.875rem;border-radius:50%;flex:0 0 auto;
  border:2px solid var(--surface-3);border-top-color:var(--accent);
  animation:vr .7s linear infinite}
.step.done .spin{border-color:var(--accent);animation:none}
.step:not(.on):not(.done) .spin{border-color:var(--surface-3);animation:none}
@keyframes vr{to{transform:rotate(360deg)}}

/* Широкий экран. Приложение задумано под телефон, поэтому на мониторе оно
   не растягивается во всю ширину — колонка остаётся читаемой. Раскрывается
   только очередь: одобрять посты удобнее, когда все карточки видны разом,
   а не по одной в длинной ленте. */
@media (min-width:52rem){
  body{padding-left:2rem;padding-right:2rem}
  header,#путь,#ход,#view{max-width:34rem;margin-left:auto;margin-right:auto}
  /* В цехе станков всего два: рядом они читаются лучше, чем друг под
     другом, и весь день помещается в один взгляд. */
  body[data-экран="цех"] header,
  body[data-экран="цех"] #путь,
  body[data-экран="цех"] #ход,
  body[data-экран="цех"] #view{max-width:52rem}
  .куда{grid-template-columns:repeat(4,1fr)}
  #создать{max-width:34rem;margin-left:auto;margin-right:auto;display:flex}
}

/* Кому движение мешает — тому его нет. Раньше правило гасило только
   кружок ожидания, а нажатия и листы продолжали прыгать. */
@media (prefers-reduced-motion:reduce){
  .spin{animation:none}
  *,*::before,*::after{animation-duration:.01ms !important;
    animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .sheet .in{animation:none}
}

@media (hover:hover){
  .кн:hover,.btn:hover,.станок:hover,.ячейка:hover,.нстр:hover,
  .вещь:hover,.сырьёкн div:hover{border-color:var(--border-strong)}
  .btn.primary:hover{background:var(--accent-hover)}
}

/* ── лист снизу ──────────────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:600;
  display:flex;align-items:flex-end;animation:fade var(--dur-micro) var(--ease-out)}
.снизу{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);
  padding-top:1rem;margin-top:.25rem}
.sheet .in{width:100%;max-height:92vh;overflow:auto;background:var(--bg);
  border-top-left-radius:1rem;border-top-right-radius:1rem;
  border-top:1px solid var(--border);padding:.75rem 1rem calc(1.25rem + env(safe-area-inset-bottom));
  animation:up var(--dur-swap) var(--ease-out)}
.ручка-листа{display:flex;align-items:center;margin:-.25rem -.25rem .75rem;
  padding-right:2.75rem;touch-action:none;position:relative;min-height:2.75rem}
.grip{width:2.25rem;height:.25rem;border-radius:999px;background:var(--surface-3);
  margin:0 auto;display:block}
.закрыть{position:absolute;right:0;top:50%;transform:translateY(-50%);
  width:2.75rem;height:2.75rem;border-radius:999px;border:0;background:transparent;
  color:var(--muted);font-size:.9375rem;line-height:1;display:grid;
  place-items:center;transition:var(--плавно)}
/* Кружок рисуем внутри: он и есть фирменная мелкая кнопка, а внешние
   44 точки остаются целью нажатия. */
.закрыть::before{content:"";position:absolute;width:1.75rem;height:1.75rem;
  border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
  transition:var(--плавно)}
.закрыть span{position:relative}
.закрыть:active::before{background:var(--surface-3);border-color:var(--border-strong)}
.закрыть:active{color:var(--text)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(4%)}}

.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);
  background:var(--surface-3);border:1px solid var(--border-strong);
  border-radius:999px;padding:.5rem 1rem;font-size:.8125rem;z-index:800;
  box-shadow:var(--shadow);animation:fade var(--dur-micro)}
.toast.bad{border-color:var(--danger);color:var(--danger)}

select{width:100%;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:.625rem .75rem}
.галка{display:flex;align-items:center;gap:.5rem;margin-top:.5rem;font-size:.8125rem;
  color:var(--muted)}
.галка input{width:1rem;height:1rem;accent-color:var(--accent)}
input[type=datetime-local],input[type=text],input[type=url],textarea{
  width:100%;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:.625rem .75rem;
  transition:border-color var(--dur-micro)}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:9rem;line-height:1.5}
.field{margin-bottom:.5rem}
.field label{display:block;font-size:.6875rem;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
.hint{font-size:.75rem;color:var(--muted);margin-top:.375rem;line-height:1.45}
.gear{border:1px solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:999px;width:2.75rem;height:2.75rem;font-size:1rem;
  display:flex;align-items:center;justify-content:center;transition:var(--плавно)}
.gear:active{transform:var(--press)}
.gear.off{border-color:var(--warn);background:var(--surface-2)}
.step.live{color:var(--accent);font-variant-numeric:tabular-nums}
.plat{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:.625rem;margin-bottom:.5rem}
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="" width="28" height="28">
  <div class="name">Редактор</div>
  <button class="ch" id="mac" title="Состояние мака"></button>
  <button class="ch" id="ch"></button>
  <button class="gear" id="звук" title="Звук уведомлений"
          aria-label="Звук уведомлений">🔔</button>
  <button class="gear" id="gear" title="Настройки"
          aria-label="Настройки">⚙️</button>
</header>

<div id="путь" hidden></div>

<div id="ход" hidden></div>
<div id="view"></div>
<script>
const ТГ = window.Telegram?.WebApp;
const AUTH = ТГ?.initData || "";
// Вне телеграма подписи нет, и тогда пропуском служит ключ из адреса.
// Он же остаётся в браузере, чтобы не таскать его в ссылке при каждом заходе.
const КЛЮЧ = (new URLSearchParams(location.search).get("key")
              || localStorage.getItem("ключ") || "");
if (КЛЮЧ) { try { localStorage.setItem("ключ", КЛЮЧ); } catch (e) {} }
let С = null, рубрика = null, тема = "";

// Мини-приложение живёт внутри телеграма, и половина его удобства — это
// не наша вёрстка, а то, что даёт сама площадка. Берём то, что есть, и
// молча обходимся без остального: у людей разные версии клиента.
const версия = н => !!ТГ?.isVersionAtLeast?.(н);

if (ТГ) {
  ТГ.ready(); ТГ.expand();
  ТГ.setHeaderColor?.("#0f0f0f");
  ТГ.setBackgroundColor?.("#0f0f0f");
  if (версия("7.10")) ТГ.setBottomBarColor?.("#0f0f0f");
  // Свайп вниз по умолчанию закрывает приложение. У нас длинный цех и
  // длинные листы: пролистывая их, человек регулярно выкидывал себя в чат.
  if (версия("7.7")) ТГ.disableVerticalSwipes?.();
  // Отступы под чёлку и полосу жеста считает сам телеграм: в вебвью
  // env(safe-area-inset) врёт.
  const отступы = () => {
    const н = ТГ.contentSafeAreaInset || {}, б = ТГ.safeAreaInset || {};
    document.documentElement.style.setProperty(
      "--низ", `${(н.bottom || 0) + (б.bottom || 0)}px`);
    document.documentElement.style.setProperty(
      "--верх", `${(н.top || 0) + (б.top || 0)}px`);
  };
  if (версия("8.0")) {
    отступы();
    ТГ.onEvent?.("safeAreaChanged", отступы);
    ТГ.onEvent?.("contentSafeAreaChanged", отступы);
  }
}
const тук = (в="light") => ТГ?.HapticFeedback?.impactOccurred?.(в);

async function зов(путь, тело) {
  const о = await fetch(путь, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Init-Data": AUTH},
    body: JSON.stringify(КЛЮЧ ? {...(тело || {}), key: КЛЮЧ} : (тело || {}))
  });
  const д = await о.json().catch(() => ({error: "сервер молчит"}));
  if (!о.ok) throw new Error(д.error || "не вышло");
  return д;
}

// Всплывашка сообщает об итоге действия, и человек с чтецом экрана должен
// его услышать: без aria-live она для него просто не существует.
function сказать(текст, плохо) {
  document.querySelector(".toast")?.remove();
  const э = document.createElement("div");
  э.className = "toast" + (плохо ? " bad" : "");
  э.setAttribute("role", плохо ? "alert" : "status");
  э.setAttribute("aria-live", плохо ? "assertive" : "polite");
  э.textContent = текст;
  document.body.appendChild(э);
  setTimeout(() => э.remove(), 2600);
}

// Карточка из хранилища открывается напрямую, своя, с диска, только по подписи
const кар = п => !п.image ? null
  : п.image.startsWith("http") ? п.image
  : п.image + "?auth=" + encodeURIComponent(AUTH)
    + (КЛЮЧ ? "&key=" + encodeURIComponent(КЛЮЧ) : "");
const экр = т => (т || "").replace(/[&<>"]/g,
  с => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[с]));

// ── экраны ────────────────────────────────────────────────────────────────
// Пропорции у площадок называются по-своему; в настройках станка человеку
// нужны цифры, а не наши внутренние клички.
const ВИДЫ_ФОРМАТА = {"квадрат": "1:1", "широкий": "16:9", "3к4": "3:4",
                      "вертикаль": "9:16"};

const ВИДЫ_РАБОТ = {
  "заказ": "🎠 Собираю заказ",
  "карусель": "🎠 Собираю карусель", "пост": "📝 Сочиняю пост",
  "переписать": "✏️ Переписываю", "перерисовать": "🎨 Перерисовываю кота",
  "неделя": "📅 Набиваю план на неделю", "обновить": "🔄 Обновляю",
  "запланировать": "🕑 Ставлю в план", "опубликовать": "🚀 Публикую",
};
let опросХода = null;

// Что делает работа, человеческими словами. «заказ · 2 из 3 · слайд 4 из 9»
// само по себе ничего не значит; «вторая из трёх, слайд 4 из 9» — значит.
function словами(з) {
  const части = String(з.этап || "").split("·").map(с => с.trim()).filter(Boolean);
  const партия = части.length > 1 ? части.shift() : "";
  const этап = части.join(" · ") || "начинаю";
  const куда = з.куда ? " для " + чистоеИмя(площадкаИмя(з.куда)) : "";
  const сколько = з.сколько > 1 ? ` · ${з.сколько} штуки` : "";
  return {
    что: (ВИДЫ_РАБОТ[з.вид] || з.вид) + куда,
    этап: (партия ? партия + " · " : "") + этап,
    подпись: сколько,
  };
}
const площадкаИмя = код => ((С.pipeline || []).find(п => п.код === код) || {}).имя
                          || код || "";

function ходРабот() {
  const э = document.getElementById("ход");
  const работы = С?.работы || [];
  // Пока открыт лист шагов, он и есть состояние: показывать то же самое
  // ещё и полоской сверху значит говорить одно и то же трижды.
  const влисте = !!document.querySelector(".sheet .work");
  э.hidden = !работы.length || влисте;
  э.innerHTML = работы.map(з => {
    const с = словами(з);
    return `<div class="полоска">
      <span class="spin"></span>
      <span class="что">${экр(с.что)}</span>
      <span class="этап">${экр(с.этап)}</span>
    </div>`;
  }).join("");

  // Пока что-то делается, состояние подтягивается само: иначе полоска
  // застынет на первом этапе и будет врать. Весь экран перерисовываем
  // только когда работа кончилась — иначе лента прыгала бы каждые три
  // секунды под руками.
  clearTimeout(опросХода);
  if (!работы.length) return;
  опросХода = setTimeout(async () => {
    try { С = await зов("/api/state"); } catch (e) { ходРабот(); return; }
    ходРабот();
    if (!(С.работы || []).length) { рисовать(); считать(); }
  }, 3000);
}

// Верхний экран это станки, а не лента постов. Внутрь станка заходят за
// сменой, из смены — в пост. Возврат всегда один и тот же, поэтому вкладки
// не нужны и заблудиться негде.
let экран = "цех", станок = null;

const АДРЕСА = {"цех": "shop", "сырьё": "stock"};

function идти(куда, код) {
  экран = куда; станок = код || null;
  // В адресе латиница: кириллицу браузер кодирует процентами, и ссылка
  // перестаёт узнаваться при возврате.
  location.hash = куда === "станок" ? "m-" + код : (АДРЕСА[куда] || "shop");
  рисовать();
  window.scrollTo(0, 0);
}

const НАЗАД = {станок: "Цех", "сырьё": "Цех"};

// ── родные кнопки телеграма ───────────────────────────────────────────
// «Назад» и главное действие рисует сам клиент. Они не уезжают со скроллом,
// не занимают место в вёрстке и выглядят так, как человек привык во всех
// остальных мини-приложениях. В обычном браузере их нет, и тогда работают
// наши собственные — поэтому те никуда не деваются, а только прячутся.
let нажатиеГлавной = null;

function главноеДело() {
  if (!С) return null;
  const спит = !С.mac?.alive;
  if (экран === "цех") {
    const пусто = (С.pipeline || []).reduce((а, н) => а + смена(н.код).пусто, 0);
    return {текст: пусто ? `✨ Собрать недостающее · ${пусто}` : "✨ Собрать пост",
            нельзя: спит, что: () => листЗаказа()};
  }
  if (экран === "станок") {
    const н = (С.pipeline || []).find(п => п.код === станок) || {};
    const с = смена(станок);
    if (н.режим !== "сам" && с.готово)
      return {текст: `📥 Забрать ${с.готово}`, нельзя: спит,
              что: () => document.querySelector("[data-забрать]")?.click()};
    return {текст: с.пусто ? `✨ Дособрать · ${с.пусто}` : "✨ Собрать ещё",
            нельзя: спит, что: () => листЗаказа({код: станок})};
  }
  return null;
}

function площадка() {
  if (!ТГ) return;
  // Пока открыт лист, «назад» означает «закрой лист», а не «уйди в цех»:
  // иначе экран под ним менялся, а сам лист оставался висеть.
  if (версия("6.1") && ТГ.BackButton) {
    (НАЗАД[экран] || document.querySelector(".sheet"))
      ? ТГ.BackButton.show() : ТГ.BackButton.hide();
  }
  const главная = ТГ.MainButton;
  if (!главная) return;
  // Пока открыт лист, главное действие принадлежит ему: две главные
  // кнопки разом — верный способ нажать не ту.
  const дело = document.querySelector(".sheet") ? null : главноеДело();
  document.body.dataset.родная = дело ? "да" : "";
  if (нажатиеГлавной) { главная.offClick(нажатиеГлавной); нажатиеГлавной = null; }
  if (!дело) return главная.hide();
  нажатиеГлавной = () => { тук("medium"); дело.что(); };
  главная.onClick(нажатиеГлавной);
  главная.setParams({text: дело.текст, color: "#c6ff34", text_color: "#171717",
                     is_active: !дело.нельзя, is_visible: true});
}

function рисовать() {
  document.body.dataset.экран = экран;
  ходРабот();
  const п = document.getElementById("путь");
  // Своя строка «назад» показывается всегда, даже когда телеграм рисует
  // свою кнопку. Две стрелки лучше, чем ни одной: на части клиентов родная
  // не появляется, и человек оказывался заперт внутри станка.
  п.hidden = !НАЗАД[экран];
  if (!п.hidden) п.innerHTML =
    `<button class="назад" data-идти="цех">← ${экр(НАЗАД[экран])}</button>`;
  const в = document.getElementById("view");
  в.innerHTML = экран === "станок" ? экранСтанок(станок)
              : экран === "сырьё" ? экранСырьё()
              : экранЦех();
  подвязать();
  площадка();
}

// ── станок ────────────────────────────────────────────────────────────
// Внутри площадки всё её: смена по часам, очередь и её же настройки.
// «Пять в день» — свойство TikTok, а не приложения, и искать его в общем
// списке настроек значит каждый раз вспоминать, чьё оно.
function экранСтанок(код) {
  const н = (С.pipeline || []).find(п => п.код === код);
  if (!н) return `<div class="пусто"><b>Станка нет</b>Вернитесь в цех.</div>`;
  const руками = н.режим !== "сам";
  const с = смена(код);
  const без_ячейки = с.ждут || [];
  const вышли = (С.history || []).filter(п => ушёл(п, код)).slice(0, 6);

  const ячейки = с.ячейки.map(я => я.п ? `
    <div class="ячейка${я.вышло ? " прошла" : ""}" data-пост="${я.п.id}">
      <span class="час">${экр(я.ч)}</span>
      ${кар(я.п) ? `<img src="${кар(я.п)}" alt="Превью: ${экр(я.п.title)}"
                 width="30" height="40" loading="lazy">` : ""}
      <span class="т">${экр(я.п.title)}</span>
      <span class="сост${я.вышло ? "" : я.одобрен ? " одобрен" : " готов"}">${я.вышло
        ? "вышло" + (я.п.views ? " · 👁 " + я.п.views : "")
        : я.одобрен ? (руками ? "забрать" : "одобрен") : "в плане"}</span>
    </div>` : `
    <div class="ячейка пуста${вМинутах(я.ч) <= вМинутах(С.now) ? " прошла" : ""}"
         ${вМинутах(я.ч) > вМинутах(С.now) ? `data-пусто="${экр(я.ч)}"` : ""}
      >${экр(я.ч)} · ${вМинутах(я.ч) <= вМинутах(С.now)
        ? "прошла впустую" : "пусто · собрать"}</div>`
  ).join("") || `<div class="ячейка пуста">часы выхода не заданы</div>`;

  return `
    <div class="станок" style="margin-bottom:1rem">
      <div class="гол">
        <span class="зн" style="font-size:1.625rem">${экр(значок(н.имя))}</span>
        <div>
          <b style="font-size:1.0625rem">${экр(чистоеИмя(н.имя))}</b>
          <div class="низ">${код === "tiktok" && С.tiktok?.connected
            ? экр("@" + (С.tiktok.nick || "")) + " · подключён"
            : код === "телеграм" ? экр(С.channel || "канал не задан")
            : (н.вкл ? "автопилот включён" : "автопилот выключен")}</div>
        </div>
        <div class="тумблер${н.вкл ? " on" : ""}" data-вкл="${н.код}"
             title="Автопилот"><i></i></div>
      </div>
    </div>

    <div class="lbl">Смена сегодня · ${с.вышло} вышло из
      ${(н.часы || []).length}</div>
    ${ячейки}

    <div class="row" style="margin-top:.625rem">
      ${руками && с.готово ? `<button class="btn primary" id="забрать-все"
        >📥 Забрать ${с.готово}</button>` : ""}
      <button class="btn ghost" id="дособрать" ${С.mac?.alive ? "" : "disabled"}
        >✨ ${с.пусто ? "Дособрать · " + с.пусто : "Собрать ещё"}</button>
    </div>

    ${без_ячейки.length ? `
      <div class="lbl свер">На одобрении · ${без_ячейки.length}</div>
      <div class="hint" style="margin:-.25rem 0 .5rem">Пока пост не одобрен,
        он в смену не встаёт. Выберите ему час — или откройте и посмотрите.</div>
      ${без_ячейки.map(п => `
        <div class="карточка-ждёт">
          <div class="верхушка" data-пост="${п.id}">
            ${кар(п) ? `<img src="${кар(п)}" alt="Превью: ${экр(п.title)}"
                 width="44" height="59" loading="lazy">` : ""}
            <span class="т"><span class="номер">№${п.id}</span> ${экр(п.title)}</span>
            <span class="стр">›</span>
          </div>
          <div class="часы-выбор">${(с.ячейки.filter(я => !я.п)
            .map(я => `<button data-одобрить="${п.id}" data-час="${экр(я.ч)}"
              >${экр(я.ч)}</button>`).join("")) ||
            '<span class="муть" style="font-size:.75rem">свободных ячеек нет</span>'}
          </div>
        </div>`).join("")}` : `
      <div class="hint" style="margin-top:.625rem">Всё одобренное разложено
        по ячейкам выше. Ничего не ждёт.</div>`}

    <div class="lbl свер">Настройки станка</div>
    <div class="нстр" data-нстр="режим">Публикует
      <span class="знч">${руками ? "выкладываете вы" : "станок сам"}</span>
      <span class="стр">›</span></div>
    <div class="нстр" data-нстр="часы">Сколько в день
      <span class="знч">${(н.часы || []).length}</span><span class="стр">›</span></div>
    <div class="нстр" data-нстр="дней">Запас
      <span class="знч">на ${н.дней} дн. · ${н.запас} шт.</span>
      <span class="стр">›</span></div>
    <div class="нстр" data-идти="сырьё">Угол следующей
      <span class="знч">${экр(н.угол || "по кругу")}</span>
      <span class="стр">›</span></div>
    <div class="нстр" data-нстр="формат">Формат
      <span class="знч">${экр(ВИДЫ_ФОРМАТА[н.формат] || н.формат || "—")}${
        н.файл ? " · " + экр(н.файл.toUpperCase()) : ""}${
        н.ширина ? " " + н.ширина : ""}</span>
      <span class="стр">›</span></div>
    <div class="нстр" data-нстр="аккаунт">Аккаунт
      <span class="знч">${код === "tiktok"
        ? экр(С.tiktok?.nick ? "@" + С.tiktok.nick : "не подключён")
        : экр(С.channel || "канал не задан")}</span>
      <span class="стр">›</span></div>

    <div class="lbl свер">Часы выхода</div>
    <div class="часы-станка">${(н.часы || []).map(ч =>
      `<span>${экр(ч)}</span>`).join("")}<span class="плюс"
      data-нстр="часы">＋</span></div>

    ${вышли.length ? `
      <div class="lbl свер">Уже вышли</div>
      ${вышли.map(п => строка(п)).join("")}` : ""}`;
}

// ── сырьё ─────────────────────────────────────────────────────────────
// Идеи, углы и факты — это не «настройки», а материал, из которого станок
// делает посты. Когда карусели выходят похожими друг на друга, чинить надо
// здесь, и путь сюда должен быть очевиден прямо из цеха.
function экранСырьё() {
  const идеи = С.ideas || [];
  const факты = С.facts || [];
  const углы = С.углы || [];
  const текущий = ((С.pipeline || []).find(п => п.код === "tiktok") || {}).угол;
  const место = углы.indexOf(текущий);

  return `
    <div class="lbl">Копилка · ${идеи.length}</div>
    <div class="идея">
      <label for="заметка" class="sr">Заметка в копилку</label>
      <input type="text" id="заметка" style="flex:1" autocomplete="off"
             placeholder="Ссылка, мысль или «каналов стало 6»…">
      <button class="btn" id="в-копилку" aria-label="Записать в копилку">💡</button>
    </div>
    <div class="hint">Голосовое прямо боту в чат попадает сюда же: он
      расшифрует и запишет.</div>
    ${идеи.map(и => `
      <div class="идея" style="margin-top:.375rem">
        <button class="взять" data-взять-идею="${экр(и.text)}">${экр(и.text)}</button>
        <button class="выкинуть" data-убрать-идею="${и.id}"
                aria-label="Выкинуть идею">✖️</button>
      </div>`).join("")}

    ${углы.length ? `
      <div class="lbl свер">Углы · идут по кругу</div>
      <div class="hint" style="margin:-.25rem 0 .5rem">Чтобы карусели не
        приедались, станок берёт следующий угол по кругу и не повторяется,
        пока не пройдёт все ${углы.length}.</div>
      <div class="углы">${углы.map((у, и) => `<span class="${
        у === текущий ? "on" : место >= 0 && и < место ? "был" : ""
      }">${экр(у)}</span>`).join("")}</div>` : ""}

    <div class="lbl свер">Что бот знает о проекте · ${факты.length}</div>
    ${факты.length ? `<div class="факты">${факты.map(ф => `
      <div style="display:flex;gap:.625rem;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div class="к">${экр(ф.name)}</div>
          <div class="з">${экр(ф.value)}</div>
        </div>
        <button class="выкинуть" data-факт-долой="${экр(ф.name)}"
          aria-label="Забыть факт «${экр(ф.name)}»">✖️</button></div>`).join("")}</div>`
      : `<div class="пусто" style="padding:1.25rem 1rem"><b>Пусто</b>
           Бот пишет вслепую. Расскажите ему про проект.</div>`}
    <button class="btn wide ghost" id="факт-новый"
            style="margin-top:.5rem">＋ Добавить факт</button>`;
}

// ── смена станка ──────────────────────────────────────────────────────
const назначен = (п, код) => (п.where || []).some(в => в.код === код && в.выбрана);
const ушёл = (п, код) => !!(((п.card || {})["выложено"] || {})[код])
                       || (код === "телеграм" && !!п.link);
const сегодня = с => (с || "").startsWith("сегодня");
const часПоста = п => ((п.when || "").split(" в ").pop() || "").trim();
const вМинутах = ч => {
  const м = /(\d{1,2}):(\d{2})/.exec(ч || "");
  return м ? +м[1] * 60 + +м[2] : -1;
};

// Часы берутся из настроек станка, в них раскладывается запланированное.
// Вышедшее садится в ближайшую свободную ячейку: точная минута выхода не
// важна, важно, что ячейка отработана и дырой не считается.
function смена(код) {
  const н = (С.pipeline || []).find(п => п.код === код) || {};
  const план = (С.schedule || []).filter(п => сегодня(п.when) && назначен(п, код));
  const вышли = (С.history || []).filter(п => сегодня(п.published) && ушёл(п, код));
  const занятые = new Map(план.map(п => [часПоста(п), п]));
  const ячейки = (н.часы || []).map(ч => {
    const п = занятые.get(ч);
    if (п) занятые.delete(ч);
    return {ч, п, вышло: false};
  });
  for (const в of вышли) {
    const когда = вМинутах((в.published || "").split(" в ").pop());
    let лучшая = -1, ближе = 1e9;
    ячейки.forEach((я, и) => {
      if (я.п) return;
      const д = Math.abs(вМинутах(я.ч) - когда);
      if (д < ближе) { ближе = д; лучшая = и; }
    });
    if (лучшая >= 0) { ячейки[лучшая].п = в; ячейки[лучшая].вышло = true; }
  }
  // Пост, поставленный на час, которого в настройках нет, всё равно виден:
  // прятать запланированное значит врать про день.
  for (const [ч, п] of занятые) ячейки.push({ч, п, вышло: false});
  ячейки.sort((а, б) => вМинутах(а.ч) - вМинутах(б.ч));

  // В смену пост попадает только после одобрения. Раньше свежие черновики
  // садились в ячейки сами, и человек видел день закрытым, хотя ничего
  // ещё не смотрел: смена показывала намерение, а не решение.
  const свои = (С.drafts || []).filter(п => назначен(п, код));
  const сейчас = вМинутах(С.now);
  // Одобренный пост занимает свою ячейку. Отметка стоит на самом посте:
  // так она переживает перезагрузку и видна и боту, и приложению.
  const одобрен = п => ((п.card || {})["ячейка"] || "").trim();
  for (const я of ячейки) {
    if (я.п) continue;
    const п = свои.find(x => одобрен(x) === я.ч);
    if (п) { я.п = п; я.одобрен = true; }
  }
  const свободные = свои.filter(п => !одобрен(п) || !ячейки.some(я => я.п === п));

  return {ячейки, вышло: вышли.length,
          готово: ячейки.filter(я => я.п && !я.вышло).length,
          ждут: свободные,
          пусто: ячейки.filter(я => !я.п).length,
          следующая: (ячейки.find(я => !я.п && вМинутах(я.ч) > сейчас) || {}).ч};
}

// ── цех ───────────────────────────────────────────────────────────────
function экранЦех() {
  const черновики = С.drafts || [];
  const свод = (С.pipeline || []).map(н =>
    ({н, с: смена(н.код), очередь: черновики.filter(п => назначен(п, н.код))}));
  const вышло = свод.reduce((а, с) => а + с.с.вышло, 0);
  const готовы = свод.reduce((а, с) => а + с.с.готово, 0);
  const пусто = свод.reduce((а, с) => а + с.с.пусто, 0);
  const охват = ((С.reach || [])[0] || {}).avg;
  const ничьи = черновики.filter(п => !(п.where || []).some(в => в.выбрана));

  // Состояние станка живёт в самой карточке, а не полоской над экраном:
  // в цехе ломается машина, и говорить надо про машину — что с ней,
  // почему и что вернёт её в строй.
  const станки = свод.map(({н, с, очередь}) => {
    // Только своя работа. Раньше карточка обоих станков зажигалась на любой
    // генерации, и заказ для TikTok подсвечивал заодно телеграм.
    const работа = (С.работы || []).find(р =>
      ["заказ", "карусель", "новый"].includes(р.вид) &&
      (!р.куда || р.куда === н.код));
    const беда = (С.беды || []).find(б => !б.куда || б.куда === н.код);
    const спит = !С.mac?.alive;
    const закрыта = н.вкл && !с.пусто && !с.готово && с.вышло;
    const руками = н.режим !== "сам";
    const состояние =
      спит ? {класс: "обесточен", зн: "💤", т: "Обесточен",
              п: "Мак выключен: собирать, рисовать и забирать файлы нельзя."}
    : работа ? {класс: "работает", зн: "",
                т: словами(работа).что.replace(/^\S+\s/, ""),
                п: экр(словами(работа).этап)}
    : беда ? {класс: "встал", зн: "🛑", т: "Встал",
              п: экр(беда.беда)}
    : закрыта ? {класс: "", зн: "🌙", т: "Смена закрыта",
                 п: `${с.вышло} из ${(н.часы || []).length} вышло. Следующая партия соберётся к утру.`}
    : null;

    return `
    <div class="станок${н.вкл ? "" : " спит"}${состояние ? " " + состояние.класс : ""}"
         data-станок="${н.код}">
      <div class="гол">
        <span class="зн">${экр(значок(н.имя))}</span>
        <div>
          <b>${экр(чистоеИмя(н.имя))}</b>
          <div class="низ">${н.вкл ? "пишет сам" : "спит"} ·
            ${руками ? "выкладываете вы" : "публикует сам"} ·
            ${н.часов} в день</div>
        </div>
        <div class="тумблер${н.вкл ? " on" : ""}" data-вкл="${н.код}"
             title="Автопилот"><i></i></div>
      </div>

      ${состояние ? `<div class="сост-станка">

    <div class="сырьёкн">
      <div data-идти="сырьё"><b>💡 ${(С.ideas || []).length}

                                 : "копилка пуста — бот пишет наугад"}</div>
      <div data-идти="сырьё"><b>🧠 ${(С.facts || []).length}

      >✨ ${пусто ? "Собрать недостающее · " + пусто : "Собрать пост"}</button>`;

const чистоеИмя = и => (и || "").replace(/^\S+\s/, "");
const значок = и => (и || "").split(" ")[0];

// Русское число согласуется по последней цифре, кроме подростков.
function склонить(н, один, два, много) {
  if (н % 100 >= 11 && н % 100 <= 14) return много;
  const п = н % 10;
  return п === 1 ? один : п >= 2 && п <= 4 ? два : много;
}
const постов = н => склонить(н, "пост", "поста", "постов");
const фактов = н => склонить(н, "факт", "факта", "фактов");
const идей = н => склонить(н, "идея", "идеи", "идей");

function строка(п, толькоЧасы) {
  const рис = кар(п);
  const час = толькоЧасы && п.when ? п.when.split(" в ").pop() : п.when;
  // Пост, отданный телеграму, выйдет даже когда всё выключено. Разное
  // поведение должно и выглядеть по-разному.
  const сам = п.at_telegram ? ' <span class="сам">выйдет сам</span>' : "";
  const охват = п.views ? `<span class="охват">👁 ${п.views}</span>` : "";
  const метка = (п.images || []).length ? ` · 🎠 ${п.images.length}` : "";
  const когда = п.when ? `<div class="w">${час}${сам}${метка}</div>`
              : п.published ? `<div class="w past">вышел ${п.published} ${охват}</div>` : "";
  return `<button class="line" data-open="${п.id}" style="margin-top:.5rem">
    ${рис ? `<img src="${рис}" alt="Превью: ${экр(п.title)}"
             width="72" height="41" loading="lazy">` : ""}
    <div><div class="t">${экр(п.title)}</div>${когда}</div>
  </button>`;
}

function открыть(п) {

  const перерисовка = (слайды.length > 1 && п.status !== "published") ? `

  const низ = план ? `

    : п.status === "published"
    ? `<div class="row снизу">
         ${п.link ? `<a class="btn ghost" style="text-decoration:none"
             href="${п.link}" target="_blank">↗️ В канале</a>` : ""}
         <button class="btn" data-act="repeat">🔁 Повторить</button>
       </div>

       ${п.views ? `<div class="hint">👁 ${п.views} просмотров${
           п.reactions ? ` · ${п.reactions} реакций и пересылок` : ""}</div>` : ""}`
    : `<div class="lbl">Когда публиковать</div>
      <div class="chips">${слоты}</div>

      ${забрать}
      ${перерисовка}
      <div class="row" style="margin-top:.5rem">
        <button class="btn ghost" data-act="pub">🚀 Сейчас</button>
        <button class="btn ghost" data-act="again">🔄 Другой</button>

  лист(`
    <div class="meta">
      <span class="tag">${экр(п.rubric)}</span>
      ${п.shape ? `<span class="tag">${экр(п.shape)}</span>` : ""}
      ${п.when ? `<span class="tag when">${п.when}</span>` : ""}
      ${п.published ? `<span class="tag done">вышел ${п.published}</span>` : ""}
    </div>
    ${п.status === "published" ? "" : `
      <div class="lbl">Куда публикуем</div>
      <div class="куда" id="куда-${п.id}">

             в.готова ? "" : " · нет ключей"}</button>`).join("")}

// Листы приходят и уходят из разных мест, и следить за каждым «remove»
// значит однажды забыть. Наблюдатель ловит их все разом.
if (ТГ?.MainButton) new MutationObserver(() => площадка())
  .observe(document.body, {childList: true});

function лист(нутро, п) {
  document.querySelector(".sheet")?.remove();
  const э = document.createElement("div");
  э.className = "sheet";
  // Закрыть лист можно было только промахом мимо него. Лист занимает до
  // 92% высоты — промахиваться некуда, и человек оставался внутри. Теперь
  // три выхода: крестик, «назад» и потянуть вниз за полоску.
  э.innerHTML = `<div class="in">
    <div class="ручка-листа">
      <span class="grip"></span>
      <button class="закрыть" aria-label="Закрыть"><span>✕</span></button>
    </div><div class="нутро">${нутро}</div></div>`;
  э.addEventListener("click", с => { if (с.target === э) закрытьЛист(); });
  э.querySelector(".закрыть").onclick = () => { тук(); закрытьЛист(); };
  тянуть(э);
  document.body.appendChild(э);
  if (п) действия(э, п);
  return э;
}

function закрытьЛист() {
  const э = document.querySelector(".sheet");
  if (!э) return false;
  э.remove();
  return true;
}

// Потянуть вниз за верх листа — привычный способ его убрать. Считаем только
// вертикаль и только от полоски: иначе жест перехватывал бы прокрутку
// длинного содержимого.
function тянуть(э) {
  const шапка = э.querySelector(".ручка-листа");
  const в = э.querySelector(".in");
  let старт = null;
  шапка.addEventListener("touchstart", с => { старт = с.touches[0].clientY; },
                         {passive: true});
  шапка.addEventListener("touchmove", с => {
    if (старт === null) return;
    const сдвиг = Math.max(0, с.touches[0].clientY - старт);
    в.style.transform = `translateY(${сдвиг}px)`;
    в.style.transition = "none";
  }, {passive: true});
  шапка.addEventListener("touchend", с => {
    const сдвиг = Math.max(0, (с.changedTouches[0]?.clientY || старт) - старт);
    старт = null;
    в.style.transition = "";
    в.style.transform = "";
    if (сдвиг > 70) { тук(); закрытьЛист(); }
  }, {passive: true});
}

function действия(э, п) {
  let выбран = null;

  // Номер слайда выбирается отдельно от действия: «перерисовать» без
  // указания какой — самая частая ошибка, если чип сразу что-то запускает.
  э.querySelectorAll("[data-слайд]").forEach(б => б.onclick = () => {
    тук();
    const уже = б.classList.contains("on");
    э.querySelectorAll("[data-слайд]").forEach(д => д.classList.remove("on"));
    if (!уже) б.classList.add("on");
    э.querySelectorAll('[data-act^="кот-"]').forEach(д => д.disabled = уже);
  });
  э.querySelectorAll("[data-slot]").forEach(б => б.onclick = () => {
    тук();
    э.querySelectorAll("[data-slot]").forEach(д => д.classList.remove("on"));
    б.classList.add("on");
    выбран = б.dataset.slot;
    const п_ = э.querySelector("#своё");
    if (п_) п_.value = выбран.slice(0, 16);
  });

  э.querySelectorAll("[data-куда]").forEach(б => б.onclick = async () => {
    тук();
    try {
      const о = await зов("/api/where", {id: п.id, net: б.dataset.куда});
      п.where = о.where;
      э.querySelectorAll("[data-куда]").forEach(д => {
        const в = о.where.find(x => x.код === д.dataset.куда);
        д.classList.toggle("on", !!(в && в.выбрана));
      });
    } catch (e) { сказать(e.message, true); }
  });

  const кнопки = э.querySelectorAll("[data-act]");
  const занят = (да) => кнопки.forEach(б => б.disabled = да);

  э.querySelectorAll("[data-act]").forEach(б => б.onclick = async () => {
    const что = б.dataset.act;
    тук("medium");
    try {
      занят(true);
      if (что === "pub") {
        await довести(await зов("/api/publish", {id: п.id}));
        сказать("🚀 Опубликовано");
        э.remove();
      } else if (что === "plan" || что === "move") {
        if (что === "move") { снова(п); занят(false); return; }
        const когда = выбран || э.querySelector("#своё")?.value;
        if (!когда) { сказать("Выберите время", true); занят(false); return; }
        await довести(await зов("/api/schedule", {id: п.id, when: когда}));
        сказать("🕑 Поставил на " + когда.replace("T", ", "));
        э.remove();
      } else if (что === "repeat") {
        const о = await зов("/api/repeat", {id: п.id});
        С = о.state; рисовать(); считать();
        сказать("🔁 Копия в черновиках");
        э.remove();
        открыть(о.post);
      } else if (что === "edit") {
        э.remove(); return править(п);
      } else if (что === "ask") {
        э.remove(); return спросить(п);
      } else if (что === "repose") {
        э.remove();
        const свежий = await работа("/api/repose", {id: п.id}, ШАГИ_КОТ);
        if (свежий) открыть(свежий);
        return;
      } else if (что === "take") {
        э.remove();
        await работа("/api/take", {id: п.id, куда: "tiktok"}, ШАГИ_ФАЙЛЫ);
        сказать("📥 Файлы в чате, папка открыта на маке");
        return;
      } else if (что.startsWith("кот-")) {
        const слайд = +(э.querySelector("[data-слайд].on")?.dataset.слайд || 0);
        if (!слайд) return;
        э.remove();
        const свежий = await работа("/api/repose", {
          id: п.id, слайд,
          новая: что === "кот-новый",
          брак: что === "кот-брак",
        }, что === "кот-новый" ? ШАГИ_КОТ_НОВЫЙ : ШАГИ_КОТ);
        if (свежий) открыть(свежий);
        return;
      } else if (что === "again") {
        await зов("/api/drop", {id: п.id});
        э.remove();
        рубрика = п.rubric === "стрим" ? рубрика : п.rubric;
        return сочинить(п.rubric === "стрим" ? "stream"
                      : п.rubric === "карусель" ? "carousel" : "post");
      } else if (что === "off") {
        await довести(await зов("/api/unschedule", {id: п.id}));
        сказать("Снял с плана");
        э.remove();
      } else if (что === "drop") {
        const о = await зов("/api/drop", {id: п.id});
        С = о.state || С;
        сказать("Удалил");
        э.remove();
      }
      рисовать();
      считать();
    } catch (e) {
      сказать(e.message, true);
      занят(false);
    }
  });
}

function снова(п) {
  открыть({...п, status: "draft"});
}

const ШАГИ_ПЛАН = [["пишу", "📅 Набиваю расписание"], ["готово", "✅ Готово"]];

// Долгая работа: показываем шаги, спрашиваем состояние, возвращаем готовый пост
// Действия с каналом ушли на мак заданием: сессия аккаунта только там.
// Ответ приходит не с готовым состоянием, а с ключом задания.
async function довести(ответ) {
  if (!ответ || !ответ.job) return ответ;
  for (let н = 0; н < 200; н++) {
    await new Promise(р => setTimeout(р, 1200));
    const о = await зов("/api/job", {job: ответ.job});
    if (о.state === "ошибка") throw new Error(о.error || "не получилось");
    if (о.state === "готово") { С = await зов("/api/state"); return о; }
  }
  throw new Error("слишком долго");
}

async function работа(путь, тело, шаги = ШАГИ) {
  const э = лист(`<div class="work">${шаги.map(([к, п]) =>
      `<div class="step" data-step="${к}"><span class="spin"></span>${п}</div>`).join("")}
    <div class="step live" id="live"></div></div>`);
  const шаг = к => {
    const и = шаги.findIndex(с => с[0] === к);
    э.querySelectorAll("[data-step]").forEach((д, н) => {
      д.classList.toggle("on", н === и);
      д.classList.toggle("done", н < и);
    });
    if (и < 0) э.querySelector("#live").textContent = к;   // «пост 3 из 7»
  };
  шаг(шаги[0][0]);
  try {
    const {job} = await зов(путь, тело);
    for (let н = 0; н < 600; н++) {
      await new Promise(р => setTimeout(р, 1500));
      const о = await зов("/api/job", {job});
      if (о.state === "ошибка") throw new Error(о.error || "не получилось");
      шаг(о.state);
      if (о.state === "готово") {
        тук("medium");
        С = await зов("/api/state");
        рисовать(); считать();
        э.remove();
        return о.post || null;
      }
    }
    throw new Error("слишком долго");
  } catch (e) {
    сказать(e.message, true);
    э.remove();
    return null;
  }
}

      // действия. Раньше здесь стояло С = о.state, и состояние обнулялось.
      const о = await довести(await зов("/api/update", {
