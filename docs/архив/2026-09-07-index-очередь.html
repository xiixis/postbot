<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Редактор 4xTube</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Палитра и шкала взяты из приложения 4xTube: те же переменные, те же
   скругления и та же кривая движения. Мини-приложение должно читаться как
   его продолжение, а не как отдельный сайт. */
:root{
  --bg:#0f0f0f; --surface:#171717; --surface-2:#1f1f1f; --surface-3:#2b2b2b;
  --border:#2e2e2e; --border-strong:#454545;
  --text:#f2f2f0; --muted:#8d8d87;
  --accent:#c6ff34; --accent-hover:#d3ff5e; --accent-soft:#2b3a0d; --on-accent:#171717;
  --violet:#a78bfa; --danger:#ff6b6b; --warn:#ffb648;
  --radius:.5rem; --radius-sm:.25rem;
  --shadow:0 8px 26px rgba(0,0,0,.7); --shadow-soft:0 2px 8px rgba(0,0,0,.4);
  --dur-micro:.2s; --dur-swap:.3s;
  --ease-out:cubic-bezier(.05,.7,.1,1);
  --press:scale(.97);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:clamp(14px,.25vw+12.8px,17px)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:.875rem/1.5 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:0 1rem calc(1.25rem + env(safe-area-inset-bottom));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

/* ── шапка ───────────────────────────────────────────────────────────── */
header{display:flex;align-items:center;gap:.625rem;padding:1rem 0 .875rem;
  min-width:0}
header img{width:1.75rem;height:1.75rem;display:block}
header .name{font-weight:700;letter-spacing:-.01em;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header #mac{margin-left:auto;font-size:.75rem;padding:.3125rem .625rem;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  color:var(--muted)}
header #mac.off{border-color:var(--warn);color:var(--warn)}
header #mac{flex:0 0 auto}
@media (max-width:30rem){header #mac .слово{display:none}}
header .ch{color:var(--muted);font-size:.75rem;min-width:0;flex:0 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:.3125rem .625rem;transition:var(--dur-micro)}
header .ch:active{transform:var(--press)}
/* основной канал подсвечен: это канал на десять тысяч человек, и то, что
   пишем сейчас именно туда, должно читаться с одного взгляда */
header .ch.main{color:var(--accent);border-color:var(--accent);
  background:var(--accent-soft)}
.pick{display:flex;align-items:center;gap:.625rem;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius);padding:.75rem;margin-bottom:.5rem;
  transition:var(--dur-micro)}
.pick:active{transform:var(--press)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .галка{width:1.25rem;color:var(--accent)}
.pick .низ{font-size:.75rem;color:var(--muted)}

/* ── вкладки ─────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:.25rem;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:.25rem;margin-bottom:1rem}
.tabs button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);
  border-radius:999px;padding:.5rem;font-size:.8125rem;font-weight:600;
  transition:var(--dur-micro)}
.tabs button.on{background:var(--surface-3);color:var(--text)}
.tabs button:active{transform:var(--press)}
.tabs .dot[hidden]{display:none}
.tabs .dot{display:inline-block;min-width:1.25rem;margin-left:.25rem;
  font-size:.6875rem;color:var(--on-accent);background:var(--accent);
  border-radius:999px;padding:0 .3rem}

/* ── общие блоки ─────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:.875rem;box-shadow:var(--shadow-soft)}
.card + .card{margin-top:.625rem}
.lbl{font-size:.6875rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin:1.25rem 0 .5rem}
.lbl:first-child{margin-top:0}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:2.5rem 1rem;line-height:1.6}
.empty b{display:block;color:var(--text);margin-bottom:.25rem}

.stats{display:flex;gap:.5rem;margin-top:.75rem}
/* min-width:0 обязателен: без него колонка не даёт себя сжать, и длинное
   слово распирает строку вместо переноса. */
.stats div{flex:1 1 0;min-width:0;background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);padding:.625rem;text-align:center;
  font-size:.6875rem;color:var(--muted);overflow-wrap:anywhere}

/* Факты это не числа, а предложения разной длины. В плитках со «сводкой» они
   ломали строку: там крупный жирный текст по центру, рассчитанный на «165$»,
   а приходит «перестали использовать, аватаров в роликах нет». */
/* Справка о проекте: один список, а не девять карточек. Правило «.факты div»
   цепляло и вложенные подпись со значением, поэтому каждый факт рисовался
   рамкой внутри рамки и блок съедал половину экрана. */
.факты{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);margin-top:.75rem;overflow:hidden}
.факты>div{padding:.5rem .75rem;min-width:0}
.факты>div+div{border-top:1px solid var(--border)}
.факты .к{font-size:.625rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.125rem}
.факты .з{font-size:.8125rem;line-height:1.35;color:var(--text);
  overflow-wrap:anywhere}
.stats b{display:block;font-size:1.125rem;color:var(--text);font-weight:700;
  line-height:1.2;font-variant-numeric:tabular-nums}

.идея{display:flex;gap:.375rem;margin-bottom:.375rem}
.идея .взять{flex:1;text-align:left;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:.625rem .75rem;
  font-size:.8125rem;line-height:1.35;transition:var(--dur-micro)}
.идея .взять:active{transform:var(--press)}
.идея .выкинуть{background:transparent;border:1px solid var(--border);color:var(--muted);
  border-radius:var(--radius);padding:0 .625rem;font-size:.75rem}

.chips{display:flex;flex-wrap:wrap;gap:.375rem}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:.4375rem .875rem;font-size:.8125rem;
  transition:var(--dur-micro)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip:active{transform:var(--press)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  border-radius:999px;padding:.625rem 1.25rem;font-size:.8125rem;
  transition:var(--dur-micro);box-shadow:var(--shadow-soft)}
.btn:active:not(:disabled){transform:var(--press)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:600}
.btn.wide{width:100%;padding:.8125rem}
.btn.ghost{background:transparent;border-color:var(--border)}
.btn.danger{color:var(--danger);border-color:var(--border)}
.row{display:flex;gap:.5rem}
.row .btn{flex:1}

/* ── пост ────────────────────────────────────────────────────────────── */
.shot{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius);
  border:1px solid var(--border);display:block;background:var(--surface-2)}
/* Карточка очереди. Одна карточка это одно решение: что за пост, куда он
   поедет и что с ним сделать. Всё, что не помогает решить, ушло на вкладку
   «Ещё»: раньше первый экран показывал разом план, цифры, копилку, факты,
   рубрики и пять кнопок, и глазу не за что было зацепиться. */
.карта{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:.625rem}
.карта .верх{display:flex;gap:.875rem;padding:.875rem;align-items:flex-start}
/* Превью крупнее: пост узнаётся по картинке быстрее, чем по заголовку,
   а она была самым мелким элементом карточки. */
.карта .мини{width:6.25rem;flex:0 0 auto;border-radius:var(--radius-sm);
  background:var(--surface-2);aspect-ratio:3/4;object-fit:cover;display:block}
.карта .мини.широкая{aspect-ratio:16/9;width:8rem}
.карта .тело{min-width:0;flex:1;display:flex;flex-direction:column}
.карта .т{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.карта .под{margin-top:.25rem;font-size:.75rem;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:.375rem .625rem}
/* Единственный акцент на карточке. Раньше зелёными были все кнопки подряд,
   на экран приходилось пять зелёных полос, и глазу не за что было зацепиться. */
.карта .низ{padding:0 .875rem .875rem;display:flex;flex-direction:column}
.карта .низ .btn{height:3.25rem}

/* Адреса одной строкой: выбранные подписаны, остальные значком. Четыре
   кнопки в две строки занимали столько же места, сколько само решение, и
   повторялись у каждого поста. Остальное — время, правка, убрать — ушло
   под «⋯»: было восемь кнопок на карточку и сорок на экран. */
.карта .адреса{display:flex;flex-wrap:wrap;gap:.375rem;align-items:center;
  margin-top:auto;padding-top:.625rem}
.карта .адреса button{height:1.875rem;display:inline-flex;align-items:center;
  gap:.25rem;border:1px solid var(--border);background:var(--surface-2);
  color:var(--muted);border-radius:999px;padding:0 .625rem;font-size:.75rem;
  white-space:nowrap;transition:var(--dur-micro)}
.карта .адреса button.on{border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft)}
.карта .адреса button.тихо{opacity:.4;padding:0 .4375rem}
.карта .адреса button:active{transform:var(--press)}
.карта .адреса .ещё{border-color:transparent;opacity:1;background:transparent;
  font-size:1rem;padding:0 .25rem;letter-spacing:.08em}

/* Полоска хода. Генерация идёт минутами, и человек за это время сворачивает
   приложение. Вернувшись, он должен увидеть, что работа идёт, на любом
   экране, а не только в листе, из которого её запустил. */
.полоска{display:flex;align-items:center;gap:.625rem;background:var(--surface);
  border:1px solid var(--accent);border-radius:var(--radius);
  padding:.75rem .875rem;margin-bottom:.625rem}
.полоска .что{font-weight:600;font-size:.8125rem}
.полоска .этап{margin-left:auto;color:var(--muted);font-size:.75rem;
  text-align:right;overflow-wrap:anywhere}

/* Пачка. Пять постов в день в TikTok одобряются не по одному — это главная
   ежедневная работа, и у неё должна быть своя строка. */
.пачка{display:flex;align-items:center;gap:.75rem;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius);
  padding:.75rem .875rem;margin-bottom:1rem}
.пачка .т{flex:1;min-width:0;line-height:1.35}
.пачка .т b{display:block;font-weight:600}
.пачка .т span{color:var(--muted);font-size:.75rem;overflow-wrap:anywhere}
.пачка .btn{flex:0 0 auto;white-space:nowrap}
.строчка{display:flex;gap:.625rem;align-items:baseline;font-size:.8125rem;
  padding:.5rem 0;border-top:1px solid var(--border);line-height:1.35}
.строчка span{margin-left:auto;flex:0 0 auto;color:var(--muted);font-size:.75rem}
/* Создание переехало наверх: это второе по частоте действие после
   одобрения, а внизу его приходилось искать под всей лентой. */
#создать{border-color:var(--border-strong);background:transparent;
  height:3.5rem;margin-bottom:1rem}
.пусто{text-align:center;color:var(--muted);padding:2.5rem 1rem;line-height:1.5}
.пусто b{display:block;color:var(--text);font-size:1rem;margin-bottom:.375rem}

/* Куда поедет пост. Ряд переключателей прямо на карточке: раньше выбрать
   площадку можно было только кнопками в чате бота. */
/* Ровно две колонки, а не перенос: при переносе четвёртая площадка вставала
   одна во всю ширину и выглядела как отдельная кнопка. */
.куда{display:grid;grid-template-columns:1fr 1fr;gap:.375rem;margin-top:.375rem}
.куда button{min-width:0;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted);border-radius:var(--radius);
  padding:.4375rem .5rem;font-size:.75rem;transition:var(--dur-micro);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.куда button.on{border-color:var(--accent);color:var(--accent);
  background:var(--accent-soft)}
.куда button.серая{opacity:.45}
.куда button:active{transform:var(--press)}
.аккаунт{display:flex;align-items:center;gap:.75rem}
.кружок{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;
  place-items:center;font-size:1.35rem;background:var(--surface-3);
  border:1px solid var(--border);flex:0 0 auto}
.ттпост{margin-top:.5rem}
.ттпост .t{margin:.5rem 0 .625rem;font-weight:600}
.лента.малая img{width:32%}
/* Карусель листается пальцем и прилипает к слайду: так же, как в телеграме */
.лента{display:flex;gap:.5rem;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;padding-bottom:.375rem;margin:0 -1px}
.лента::-webkit-scrollbar{height:0}
.лента img{width:74%;flex:0 0 auto;aspect-ratio:1;object-fit:cover;
  scroll-snap-align:center;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--surface-2)}
.лента img:only-child{width:100%}
.счётслайдов{font-size:.75rem;color:var(--muted);margin-top:.375rem;text-align:center}
.post{margin-top:.75rem;white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
.post b{font-weight:700}
.post code{background:var(--surface-3);border-radius:var(--radius-sm);
  padding:.0625rem .3125rem;font-size:.8125em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.post blockquote{margin:.5rem 0;padding:.125rem 0 .125rem .75rem;
  border-left:2px solid var(--accent);color:var(--text)}
.post a{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:.375rem;align-items:center;
  font-size:.75rem;color:var(--muted)}
.tag{background:var(--surface-2);border:1px solid var(--border);
  border-radius:999px;padding:.125rem .5rem}
.tag.when{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tag.done{color:var(--muted)}

/* строка расписания */
.line{display:flex;gap:.75rem;align-items:center;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  border-radius:var(--radius);padding:.75rem;transition:var(--dur-micro)}
.line:active{transform:var(--press)}
.line img{width:4.5rem;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius-sm);
  flex:0 0 auto;background:var(--surface-2)}
.line .t{font-size:.8125rem;line-height:1.35;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line .w{font-size:.6875rem;color:var(--accent);margin-top:.25rem}
.line .w.past{color:var(--muted)}
.сам{color:var(--muted);font-weight:400}
.охват{color:var(--muted);font-variant-numeric:tabular-nums;margin-left:.375rem}

/* ── работа ──────────────────────────────────────────────────────────── */
.work{display:flex;flex-direction:column;gap:.625rem;padding:1.5rem .875rem}
.step{display:flex;align-items:center;gap:.625rem;color:var(--muted);
  font-size:.8125rem;transition:var(--dur-swap)}
.step.on{color:var(--text)}
.step.done{color:var(--muted)}
.spin{width:.875rem;height:.875rem;border-radius:50%;flex:0 0 auto;
  border:2px solid var(--surface-3);border-top-color:var(--accent);
  animation:vr .7s linear infinite}
.step.done .spin{border-color:var(--accent);animation:none}
.step:not(.on):not(.done) .spin{border-color:var(--surface-3);animation:none}
@keyframes vr{to{transform:rotate(360deg)}}
.сетка{display:block}

/* Широкий экран. Приложение задумано под телефон, поэтому на мониторе оно
   не растягивается во всю ширину — колонка остаётся читаемой. Раскрывается
   только очередь: одобрять посты удобнее, когда все карточки видны разом,
   а не по одной в длинной ленте. */
@media (min-width:52rem){
  body{padding-left:2rem;padding-right:2rem}
  header,.tabs,#view{max-width:34rem;margin-left:auto;margin-right:auto}
  body[data-вкладка="new"] header,
  body[data-вкладка="new"] .tabs,
  body[data-вкладка="new"] #view{max-width:64rem}
  .сетка{display:grid;grid-template-columns:1fr 1fr;gap:.625rem;align-items:start}
  .сетка .карта{margin-bottom:0}
  .куда{grid-template-columns:repeat(4,1fr)}
  #создать{max-width:34rem;margin-left:auto;margin-right:auto;display:flex}
}

@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* ── лист снизу ──────────────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:600;
  display:flex;align-items:flex-end;animation:fade var(--dur-micro) var(--ease-out)}
.снизу{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 28%);
  padding-top:1rem;margin-top:.25rem}
.sheet .in{width:100%;max-height:92vh;overflow:auto;background:var(--bg);
  border-top-left-radius:1rem;border-top-right-radius:1rem;
  border-top:1px solid var(--border);padding:.75rem 1rem calc(1.25rem + env(safe-area-inset-bottom));
  animation:up var(--dur-swap) var(--ease-out)}
.grip{width:2.25rem;height:.25rem;border-radius:999px;background:var(--surface-3);
  margin:0 auto .875rem}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(4%)}}

.toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);
  background:var(--surface-3);border:1px solid var(--border-strong);
  border-radius:999px;padding:.5rem 1rem;font-size:.8125rem;z-index:800;
  box-shadow:var(--shadow);animation:fade var(--dur-micro)}
.toast.bad{border-color:var(--danger);color:var(--danger)}

select{width:100%;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:.625rem .75rem}
.галка{display:flex;align-items:center;gap:.5rem;margin-top:.5rem;font-size:.8125rem;
  color:var(--muted)}
.галка input{width:1rem;height:1rem;accent-color:var(--accent)}
input[type=datetime-local],input[type=text],input[type=url],textarea{
  width:100%;background:var(--surface);color:var(--text);
  border:1px solid var(--border);border-radius:var(--radius);padding:.625rem .75rem;
  transition:border-color var(--dur-micro)}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:9rem;line-height:1.5}
.field{margin-bottom:.5rem}
.field label{display:block;font-size:.6875rem;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.25rem}
.hint{font-size:.75rem;color:var(--muted);margin-top:.375rem;line-height:1.45}
.gear{border:1px solid var(--border);background:var(--surface);color:var(--muted);
  border-radius:999px;width:1.875rem;height:1.875rem;font-size:.875rem;
  display:flex;align-items:center;justify-content:center;transition:var(--dur-micro)}
.gear:active{transform:var(--press)}
.gear.off{border-color:var(--warn);background:var(--surface-2)}
.step.live{color:var(--accent);font-variant-numeric:tabular-nums}
.plat{background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:.625rem;margin-bottom:.5rem}
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="">
  <div class="name">Редактор</div>
  <button class="ch" id="mac" title="Состояние мака"></button>
  <button class="ch" id="ch"></button>
  <button class="gear" id="звук" title="Звук уведомлений">🔔</button>
  <button class="gear" id="gear" title="Настройки">⚙️</button>
</header>

<div class="tabs">
  <button data-tab="new" class="on">Очередь<span class="dot" id="cnt" hidden>0</span></button>
  <button data-tab="plan">План<span class="dot" id="cnt2" hidden>0</span></button>
  <button data-tab="more">Ещё</button>
</div>

<div id="ход" hidden></div>
<div id="view"></div>
<script>
const ТГ = window.Telegram?.WebApp;
const AUTH = ТГ?.initData || "";
// Вне телеграма подписи нет, и тогда пропуском служит ключ из адреса.
// Он же остаётся в браузере, чтобы не таскать его в ссылке при каждом заходе.
const КЛЮЧ = (new URLSearchParams(location.search).get("key")
              || localStorage.getItem("ключ") || "");
if (КЛЮЧ) { try { localStorage.setItem("ключ", КЛЮЧ); } catch (e) {} }
// вкладку можно открыть сразу: /#plan, /#past
let С = null, вкладка = (location.hash.slice(1) || "new"), рубрика = null, тема = "";

if (ТГ) { ТГ.ready(); ТГ.expand(); ТГ.setHeaderColor?.("#0f0f0f"); ТГ.setBackgroundColor?.("#0f0f0f"); }
const тук = (в="light") => ТГ?.HapticFeedback?.impactOccurred?.(в);

async function зов(путь, тело) {
  const о = await fetch(путь, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Init-Data": AUTH},
    body: JSON.stringify(КЛЮЧ ? {...(тело || {}), key: КЛЮЧ} : (тело || {}))
  });
  const д = await о.json().catch(() => ({error: "сервер молчит"}));
  if (!о.ok) throw new Error(д.error || "не вышло");
  return д;
}

function сказать(текст, плохо) {
  document.querySelector(".toast")?.remove();
  const э = document.createElement("div");
  э.className = "toast" + (плохо ? " bad" : "");
  э.textContent = текст;
  document.body.appendChild(э);
  setTimeout(() => э.remove(), 2600);
}

// Карточка из хранилища открывается напрямую, своя, с диска, только по подписи
const кар = п => !п.image ? null
  : п.image.startsWith("http") ? п.image
  : п.image + "?auth=" + encodeURIComponent(AUTH)
    + (КЛЮЧ ? "&key=" + encodeURIComponent(КЛЮЧ) : "");
const экр = т => (т || "").replace(/[&<>"]/g,
  с => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[с]));

// ── экраны ────────────────────────────────────────────────────────────────
const ВИДЫ_РАБОТ = {
  "карусель": "🎠 Собираю карусель", "пост": "📝 Сочиняю пост",
  "переписать": "✏️ Переписываю", "перерисовать": "🎨 Перерисовываю кота",
  "неделя": "📅 Набиваю план на неделю", "обновить": "🔄 Обновляю",
  "запланировать": "🕑 Ставлю в план", "опубликовать": "🚀 Публикую",
};
let опросХода = null;

function ходРабот() {
  const э = document.getElementById("ход");
  const работы = С?.работы || [];
  э.hidden = !работы.length;
  э.innerHTML = работы.map(з => `<div class="полоска">
      <span class="spin"></span>
      <span class="что">${экр(ВИДЫ_РАБОТ[з.вид] || з.вид)}</span>
      <span class="этап">${экр(з.этап)}</span>
    </div>`).join("");

  // Пока что-то делается, состояние подтягивается само: иначе полоска
  // застынет на первом этапе и будет врать. Весь экран перерисовываем
  // только когда работа кончилась — иначе лента прыгала бы каждые три
  // секунды под руками.
  clearTimeout(опросХода);
  if (!работы.length) return;
  опросХода = setTimeout(async () => {
    try { С = await зов("/api/state"); } catch (e) { ходРабот(); return; }
    ходРабот();
    if (!(С.работы || []).length) { рисовать(); считать(); }
  }, 3000);
}

function рисовать() {
  document.body.dataset.вкладка = вкладка;
  ходРабот();
  document.querySelectorAll(".tabs button").forEach(б =>
    б.classList.toggle("on", б.dataset.tab === вкладка));
  const в = document.getElementById("view");
  в.innerHTML = вкладка === "new" ? экранОчередь()
              : вкладка === "plan" ? экранПлан()
              : экранЕщё();
  подвязать();
}

const Заглавная = с => с.charAt(0).toUpperCase() + с.slice(1);

// Главный экран это очередь на одобрение. Ничего, кроме неё: решение о посте
// принимается по обложке, заголовку и адресу, всё остальное только мешает.
function экранОчередь() {
  const черновики = С.drafts || [];
  const план = (С.schedule || []).slice(0, 3);

  const очередь = черновики.length
    ? `<div class="сетка">${черновики.map(карта).join("")}</div>`
    : `<div class="пусто"><b>Очередь пуста</b>
         Нажмите «Создать» внизу или включите конвейер во вкладке «Ещё»,
         и он будет собирать посты сам.</div>`;

  const скоро = план.length ? `
    <div class="lbl">Скоро выйдет</div>
    ${план.map(п => строка(п, true)).join("")}` : "";

  return `
    <button class="btn wide" id="создать"
            ${С.mac?.alive ? "" : "disabled"}>✨ Создать пост</button>
    ${С.mac?.alive ? "" : `<div class="hint" style="margin:-.5rem 0 1rem">
      💤 Мак выключен. Сочинять и публиковать сейчас нельзя: фирменные иконки
      и отложка телеграма работают только с него.</div>`}
    ${пачка(черновики)}
    <div class="lbl">На одобрении${черновики.length ? " · " + черновики.length : ""}</div>
    ${очередь}
    ${скоро}`;
}

const значок = и => (и || "").split(" ")[0];
const постов = н => н % 10 === 1 && н % 100 !== 11 ? "пост"
              : [2, 3, 4].includes(н % 10) && ![12, 13, 14].includes(н % 100)
                ? "поста" : "постов";

// Готов тот пост, у которого выбрана хотя бы одна работающая площадка.
const готовые = (черновики) => (черновики || []).filter(п =>
  (п.where || []).some(в => в.выбрана && в.готова));

// Строка пачки. Пять постов в день в TikTok одобряются не по одному, и
// главному ежедневному действию нужна своя строка, а не пять нажатий подряд.
function пачка(черновики) {
  const готовы = готовые(черновики);
  if (готовы.length < 2) return "";
  const адреса = [...new Set(готовы.flatMap(п =>
    (п.where || []).filter(в => в.выбрана && в.готова).map(в => чистоеИмя(в.имя))))];
  return `
    <div class="пачка">
      <div class="т"><b>${готовы.length} ${постов(готовы.length)} готовы</b>
        <span>${экр(адреса.join(", "))}</span></div>
      <button class="btn primary" id="пачкой">Опубликовать все</button>
    </div>`;
}

// Подпись главной кнопки говорит, куда именно уйдёт пост. «Опубликовать» без
// адреса заставляло вспоминать, что выбрано, и проверять переключатели.
function кудаПодпись(п) {
  const выбраны = (п.where || []).filter(в => в.выбрана);
  if (!выбраны.length) return "🚀 Опубликовать";
  if (выбраны.length === 1) return "🚀 Опубликовать в " + чистоеИмя(выбраны[0].имя);
  return `🚀 Опубликовать везде · ${выбраны.length}`;
}
const чистоеИмя = и => (и || "").replace(/^\S+\s/, "");

// Обновляет одну карточку на месте. Перерисовка всего экрана уводила ленту
// в начало: отметив площадку у пятой карточки, вы оказывались у первой.
function обновитьКарту(п) {
  const гнездо = document.querySelector(`[data-карта-куда="${п.id}"]`);
  гнездо?.querySelectorAll("[data-куда]").forEach(д => {
    const в = (п.where || []).find(x => x.код === д.dataset.куда);
    if (!в) return;
    д.classList.toggle("on", !!в.выбрана);
    д.classList.toggle("тихо", !в.выбрана);
    д.textContent = в.выбрана ? в.имя : значок(в.имя);
  });
  const пуб = document.querySelector(`[data-пуб="${п.id}"]`);
  if (пуб) пуб.textContent = кудаПодпись(п);
}

// Публикация пачкой. Вернуть опубликованное нельзя, поэтому сначала
// показываем, что именно уйдёт и куда, и только потом пускаем.
function листПачки(готовы) {
  if (!готовы.length) return;
  const куда = п => (п.where || []).filter(в => в.выбрана && в.готова)
                      .map(в => чистоеИмя(в.имя)).join(", ");
  const э = лист(`
    <div class="t">Опубликовать ${готовы.length} ${постов(готовы.length)}?</div>
    <div class="hint">Пойдут по очереди, каждый на свои площадки.
      Вернуть опубликованное нельзя.</div>
    ${готовы.map(п => `<div class="строчка">${экр(п.title)}
       <span>${экр(куда(п))}</span></div>`).join("")}
    <button class="btn primary wide" id="пуск"
            style="margin-top:.875rem">🚀 Опубликовать все</button>`);

  const кн = э.querySelector("#пуск");
  кн.onclick = async () => {
    кн.disabled = true;
    let вышло = 0;
    for (const п of готовы) {
      кн.textContent = `⏳ ${вышло + 1} из ${готовы.length}…`;
      try {
        await довести(await зов("/api/publish", {id: п.id}));
        вышло++;
      } catch (e) {
        сказать(`«${п.title}»: ${e.message}`, true);
        break;
      }
    }
    э.remove();
    if (вышло) сказать(`🚀 Опубликовано: ${вышло}`);
    С = await зов("/api/state"); рисовать(); считать();
  };
}

function карта(п) {
  const рис = кар(п);
  const слайдов = (п.images || []).length;
  const когда = п.when ? п.when : "без времени";
  return `
    <div class="карта" data-карта="${п.id}">
      <div class="верх">
        ${рис ? `<img class="мини${слайдов ? "" : " широкая"}" src="${рис}" alt="">`
              : ""}
        <div class="тело">
          <div class="т">${экр(п.title)}</div>
          <div class="под">
            <span>${слайдов ? слайдов + " слайдов" : экр(п.rubric)}</span>
            <span>${экр(когда)}</span>
          </div>
          <div class="адреса" data-карта-куда="${п.id}">
            ${(п.where || []).map(в =>
              `<button class="${в.выбрана ? "on" : "тихо"}" data-куда="${в.код}"
                 data-пост="${п.id}" title="${экр(чистоеИмя(в.имя))}${
                 в.готова ? "" : ", ключи не заданы"}"
               >${экр(в.выбрана ? в.имя : значок(в.имя))}</button>`).join("")}
            <button class="ещё" data-ещё="${п.id}"
                    title="Время, правка, убрать">⋯</button>
          </div>
        </div>
      </div>
      <div class="низ">
        <button class="btn primary" data-пуб="${п.id}">${кудаПодпись(п)}</button>
      </div>
    </div>`;
}

function строка(п, толькоЧасы) {
  const рис = кар(п);
  const час = толькоЧасы && п.when ? п.when.split(" в ").pop() : п.when;
  // Пост, отданный телеграму, выйдет даже когда всё выключено. Разное
  // поведение должно и выглядеть по-разному.
  const сам = п.at_telegram ? ' <span class="сам">выйдет сам</span>' : "";
  const охват = п.views ? `<span class="охват">👁 ${п.views}</span>` : "";
  const метка = (п.images || []).length ? ` · 🎠 ${п.images.length}` : "";
  const когда = п.when ? `<div class="w">${час}${сам}${метка}</div>`
              : п.published ? `<div class="w past">вышел ${п.published} ${охват}</div>` : "";
  return `<button class="line" data-open="${п.id}" style="margin-top:.5rem">
    ${рис ? `<img src="${рис}" alt="">` : ""}
    <div><div class="t">${экр(п.title)}</div>${когда}</div>
  </button>`;
}

function экранПлан() {
  const план = С.schedule || [];
  const было = (С.history || []).slice(0, 12);
  if (!план.length && !было.length) return `<div class="пусто">
    <b>Пока пусто</b>Ни одного запланированного и ни одного вышедшего поста.</div>`;

  // По дням, а не сплошным списком: так видно, где в неделе дыра.
  const дни = new Map();
  план.forEach(п => {
    const д = (п.when || "").split(" в ")[0] || "когда-нибудь";
    (дни.get(д) || дни.set(д, []).get(д)).push(п);
  });
  const расписание = план.length
    ? [...дни].map(([д, список]) =>
        `<div class="lbl">${экр(д)}</div>` +
        список.map(п => строка(п, true)).join("")).join("")
    : `<div class="lbl">Расписание</div>
       <div class="пусто"><b>Ничего не запланировано</b>
         Поставьте пост на время кнопкой «Время» в очереди — или включите
         конвейер во вкладке «Ещё», и он расставит сам.</div>`;

  const охват = (С.reach || []).slice(0, 4).map(р =>
    `<div><b>${р.avg}</b>${экр(р.rubric)}</div>`).join("");

  return `${расписание}
    ${было.length ? `
      <div style="height:1rem"></div>
      <div class="lbl">Уже вышли${С.main_channel ? " в " + экр(С.main_channel) : ""}</div>
      ${охват ? `<div class="hint" style="margin-bottom:.5rem">В среднем
                   просмотров по рубрикам</div>
                 <div class="stats">${охват}</div>
                 <div style="height:.75rem"></div>` : ""}
      ${было.map(п => строка(п)).join("")}` : ""}`;
}

// Всё, что не решение прямо сейчас. Раньше это лежало на первом экране и
// заслоняло собой очередь.
function экранЕщё() {
  const т = С.tiktok || {};
  const копилка = (С.ideas || []).length ? `
    <div class="lbl">Копилка идей</div>
    ${С.ideas.map(и => `
      <div class="идея">
        <button class="взять" data-идея="${и.id}">${экр(и.text)}</button>
        <button class="выкинуть" data-убрать-идею="${и.id}">✖️</button>
      </div>`).join("")}` : "";

  const факты = (С.facts || []).length ? `
    <div class="lbl">Бот знает о проекте</div>
    <div class="факты">${С.facts.slice(0, 8).map(ф =>
      `<div><div class="к">${экр(ф.name)}</div>
            <div class="з">${экр(ф.value)}</div></div>`).join("")}</div>` : "";

  const конв = (С.pipeline || []).map(п => `
    <button class="pick" data-конвейер="${п.код}">
      <span>${п.вкл ? "🤖" : "💤"}</span>
      <span style="flex:1">
        <b>${экр(п.имя)}</b>
        <span class="hint" style="display:block;margin:.125rem 0 0">
          ${п.вкл ? "сочиняет сам" : "спит"} ·
          ${п.режим === "сам" ? "публикует сам" : "готовит, публикуете вы"} ·
          ${п.часов} в день</span>
      </span>
      <span class="низ">${п.готово} из ${п.запас}</span>
    </button>`).join("");

  return `
    <div class="lbl">Записать в копилку</div>
    <div class="идея">
      <input type="text" id="заметка" style="flex:1"
             placeholder="Ссылка, мысль или «каналов стало 6»">
      <button class="btn" id="в-копилку">💡</button>
    </div>
    <div class="hint">Сюда же можно надиктовать голосовое прямо боту в чат:
      он расшифрует и запишет.</div>
    ${копилка}

    <div style="height:1rem"></div>
    <div class="lbl">Конвейер</div>
    ${конв || `<div class="card muted">Не удалось прочитать конвейер.
         Настройки на месте — их видно боту: ⚙️ → Конвейер.</div>`}

    <div style="height:1rem"></div>
    <div class="lbl">TikTok</div>
    ${т.connected
      ? `<div class="card аккаунт"><div class="кружок">🎵</div>
           <div><div class="т">${экр(т.name || "TikTok")}</div>
           ${т.nick ? `<div class="hint" style="margin-top:.125rem"
              >@${экр(т.nick)}</div>` : ""}</div></div>`
      : `<a class="btn wide" style="text-decoration:none"
            href="${т.link || "#"}" target="_blank" rel="noopener">
           🔗 Подключить TikTok</a>`}

    ${факты}

    <div style="height:1rem"></div>
    <div class="lbl">Прочее</div>
    <button class="btn wide" id="go-week" ${С.mac?.alive ? "" : "disabled"}>📅 План на неделю</button>
    <div style="height:.375rem"></div>
    <button class="btn ghost wide" id="go-clean" ${С.mac?.alive ? "" : "disabled"}
            title="Удалить картинки, на которые больше не ссылается ни один пост"
    >🧹 Прибраться</button>`;
}

function открыть(п) {
  const слоты = С.slots.map(с =>
    `<button class="chip" data-slot="${с.iso}">${с.label}</button>`).join("");
  const свои = new Date(Date.now() + 36e5).toISOString().slice(0, 16);
  const рис = кар(п);
  const слайды = п.images || [];
  const план = п.status === "scheduled";

  const правки = п.status === "published" ? "" : `
      <div class="row" style="margin-top:.5rem">
        <button class="btn ghost" data-act="edit">✏️ Править</button>
        <button class="btn ghost" data-act="ask">💬 Переписать</button>
        ${слайды.length ? "" : `<button class="btn ghost" data-act="repose"
          title="Другая поза кота">🎨</button>`}
      </div>`;

  // Забрать файлами. TikTok у нас в ручном режиме, и это самый частый путь
  // публикации: папка открывается на маке, файлы приходят сюда же в чат.
  const забрать = (слайды.length || рис) ? `
      <button class="btn wide ghost" data-act="take"
              style="margin-top:.5rem">📥 Забрать файлы</button>` : "";

  // Перерисовка по одному слайду. У кота бывает пять лап: пикселям всё
  // хорошо, автоматика такое не ловит, а видно сразу. Пересобирать из-за
  // одной картинки всю карусель — минуты работы и восемь новых файлов.
  const перерисовка = (слайды.length > 1 && п.status !== "published") ? `
      <div class="lbl">Перерисовать слайд</div>
      <div class="chips" id="слайды">${слайды.map((_, и) =>
        `<button class="chip" data-слайд="${и + 1}">${и + 1}</button>`).join("")}
      </div>
      <div class="row" style="margin-top:.5rem">
        <button class="btn ghost" data-act="кот-база" disabled
                title="Другая поза из библиотеки — мгновенно">🎲 Другой кот</button>
        <button class="btn ghost" data-act="кот-новый" disabled
                title="Нарисовать заново и добавить в библиотеку">✨ Нарисовать</button>
        <button class="btn ghost danger" data-act="кот-брак" disabled
                title="Эта поза бракованная, больше её не брать">🚫</button>
      </div>` : "";

  const низ = план ? `
      <div class="row снизу">
        <button class="btn primary" data-act="pub">🚀 Опубликовать сейчас</button>
      </div>
      ${правки}
      ${забрать}
      ${перерисовка}
      <div class="row" style="margin-top:.5rem">
        <button class="btn ghost" data-act="move">🕑 Перенести</button>
        <button class="btn danger" data-act="off">Снять с плана</button>
      </div>`
    : п.status === "published"
    ? `<div class="row снизу">
         ${п.link ? `<a class="btn ghost" style="text-decoration:none"
             href="${п.link}" target="_blank">↗️ В канале</a>` : ""}
         <button class="btn" data-act="repeat">🔁 Повторить</button>
       </div>

function лист(нутро, п) {
  document.querySelector(".sheet")?.remove();
  const э = document.createElement("div");
  э.className = "sheet";
  э.innerHTML = `<div class="in"><div class="grip"></div>${нутро}</div>`;
  э.addEventListener("click", с => { if (с.target === э) э.remove(); });
  document.body.appendChild(э);
  if (п) действия(э, п);
  return э;
}

function действия(э, п) {
  let выбран = null;

  // Номер слайда выбирается отдельно от действия: «перерисовать» без
  // указания какой — самая частая ошибка, если чип сразу что-то запускает.
  э.querySelectorAll("[data-слайд]").forEach(б => б.onclick = () => {
    тук();
    const уже = б.classList.contains("on");
    э.querySelectorAll("[data-слайд]").forEach(д => д.classList.remove("on"));
    if (!уже) б.classList.add("on");
    э.querySelectorAll('[data-act^="кот-"]').forEach(д => д.disabled = уже);
  });
  э.querySelectorAll("[data-slot]").forEach(б => б.onclick = () => {
    тук();
    э.querySelectorAll("[data-slot]").forEach(д => д.classList.remove("on"));
    б.classList.add("on");
    выбран = б.dataset.slot;
    const п_ = э.querySelector("#своё");
    if (п_) п_.value = выбран.slice(0, 16);
  });

  э.querySelectorAll("[data-куда]").forEach(б => б.onclick = async () => {
    тук();
    try {
      const о = await зов("/api/where", {id: п.id, net: б.dataset.куда});
      п.where = о.where;
      э.querySelectorAll("[data-куда]").forEach(д => {
        const в = о.where.find(x => x.код === д.dataset.куда);
        д.classList.toggle("on", !!(в && в.выбрана));
      });
    } catch (e) { сказать(e.message, true); }
  });

  const кнопки = э.querySelectorAll("[data-act]");
  const занят = (да) => кнопки.forEach(б => б.disabled = да);

  э.querySelectorAll("[data-act]").forEach(б => б.onclick = async () => {
    const что = б.dataset.act;
    тук("medium");
    try {
      занят(true);
      if (что === "pub") {
        await довести(await зов("/api/publish", {id: п.id}));
        сказать("🚀 Опубликовано");
        э.remove();
      } else if (что === "plan" || что === "move") {
        if (что === "move") { снова(п); занят(false); return; }
        const когда = выбран || э.querySelector("#своё")?.value;
        if (!когда) { сказать("Выберите время", true); занят(false); return; }
        await довести(await зов("/api/schedule", {id: п.id, when: когда}));
        сказать("🕑 Поставил на " + когда.replace("T", ", "));
        э.remove();
      } else if (что === "repeat") {
        const о = await зов("/api/repeat", {id: п.id});
        С = о.state; рисовать(); считать();
        сказать("🔁 Копия в черновиках");
        э.remove();
        открыть(о.post);
      } else if (что === "edit") {
        э.remove(); return править(п);
      } else if (что === "ask") {
        э.remove(); return спросить(п);
      } else if (что === "repose") {
        э.remove();
        const свежий = await работа("/api/repose", {id: п.id}, ШАГИ_КОТ);
        if (свежий) открыть(свежий);
        return;
      } else if (что === "take") {
        э.remove();
        await работа("/api/take", {id: п.id, куда: "tiktok"}, ШАГИ_ФАЙЛЫ);
        сказать("📥 Файлы в чате, папка открыта на маке");
        return;
      } else if (что.startsWith("кот-")) {
        const слайд = +(э.querySelector("[data-слайд].on")?.dataset.слайд || 0);
        if (!слайд) return;
        э.remove();
        const свежий = await работа("/api/repose", {
          id: п.id, слайд,
          новая: что === "кот-новый",
          брак: что === "кот-брак",
        }, что === "кот-новый" ? ШАГИ_КОТ_НОВЫЙ : ШАГИ_КОТ);
        if (свежий) открыть(свежий);
        return;
      } else if (что === "again") {
        await зов("/api/drop", {id: п.id});
        э.remove();
        рубрика = п.rubric === "стрим" ? рубрика : п.rubric;
        return сочинить(п.rubric === "стрим" ? "stream"
                      : п.rubric === "карусель" ? "carousel" : "post");
      } else if (что === "off") {
        await довести(await зов("/api/unschedule", {id: п.id}));
        сказать("Снял с плана");
        э.remove();
      } else if (что === "drop") {
        const о = await зов("/api/drop", {id: п.id});
        С = о.state || С;
        сказать("Удалил");
        э.remove();
      }
      рисовать();
      считать();
    } catch (e) {
      сказать(e.message, true);
      занят(false);
    }
  });
}

// Долгая работа: показываем шаги, спрашиваем состояние, возвращаем готовый пост
// Действия с каналом ушли на мак заданием: сессия аккаунта только там.
// Ответ приходит не с готовым состоянием, а с ключом задания.
async function довести(ответ) {
  if (!ответ || !ответ.job) return ответ;
  for (let н = 0; н < 200; н++) {
    await new Promise(р => setTimeout(р, 1200));
    const о = await зов("/api/job", {job: ответ.job});
    if (о.state === "ошибка") throw new Error(о.error || "не получилось");
    if (о.state === "готово") { С = await зов("/api/state"); return о; }
  }
  throw new Error("слишком долго");
}

async function работа(путь, тело, шаги = ШАГИ) {
  const э = лист(`<div class="work">${шаги.map(([к, п]) =>
      `<div class="step" data-step="${к}"><span class="spin"></span>${п}</div>`).join("")}
    <div class="step live" id="live"></div></div>`);
  const шаг = к => {
    const и = шаги.findIndex(с => с[0] === к);
    э.querySelectorAll("[data-step]").forEach((д, н) => {
      д.classList.toggle("on", н === и);
      д.classList.toggle("done", н < и);
    });
    if (и < 0) э.querySelector("#live").textContent = к;   // «пост 3 из 7»
  };
  шаг(шаги[0][0]);
  try {
    const {job} = await зов(путь, тело);
    for (let н = 0; н < 600; н++) {
      await new Promise(р => setTimeout(р, 1500));
      const о = await зов("/api/job", {job});
      if (о.state === "ошибка") throw new Error(о.error || "не получилось");
      шаг(о.state);
      if (о.state === "готово") {
        тук("medium");
        С = await зов("/api/state");
        рисовать(); считать();
        э.remove();
        return о.post || null;
      }
    }
    throw new Error("слишком долго");
  } catch (e) {
    сказать(e.message, true);
    э.remove();
    return null;
  }
}

function править(п) {
  const к = п.card || {};
  const э = лист(`

    <textarea id="p-body">${экр(п.body)}</textarea>
    <div class="hint">Разметка: **жирный**, _курсив_, \`моноширинный\`, &gt; цитата.

      <span id="счёт"></span></div>
    <div class="lbl">Надписи на карточке</div>
    <div class="field"><label>Сверху</label>
      <input type="text" id="c-eye" value="${экр(к.card_eyebrow)}"></div>
    <div class="field"><label>Заголовок</label>
      <input type="text" id="c-title" value="${экр(к.card_title)}"></div>
    <div class="field"><label>Пункты, по одному в строке</label>
      <textarea id="c-lines" style="min-height:6rem">${экр((к.card_lines || []).join("\n"))}</textarea></div>
    <div class="field"><label>Подпись снизу</label>

      <button class="btn primary" id="save">💾 Сохранить</button>
      <button class="btn ghost" id="back">Назад</button>
    </div>`);

  // Предел подписи 1024. Перебрать легко, и тогда пост разорвётся надвое.
  const поле = э.querySelector("#p-body"), счёт = э.querySelector("#счёт");
  const считать_знаки = () => {
    const н = поле.value.replace(/\*\*|__|[_`>]/g, "").length;
    счёт.textContent = ` · ${н} из 1024`;
    счёт.style.color = н > 950 ? "var(--warn)" : "var(--muted)";
    счёт.style.fontWeight = н > 950 ? "600" : "400";
  };
  поле.oninput = считать_знаки;
  считать_знаки();

  э.querySelector("#back").onclick = () => { э.remove(); открыть(п); };
  э.querySelector("#save").onclick = async () => {
    тук("medium");
    const кнопка = э.querySelector("#save");
    кнопка.disabled = true;
    кнопка.textContent = "⏳ Рисую карточку…";
    try {
      const о = await зов("/api/update", {
        id: п.id,
        body: э.querySelector("#p-body").value,
        card: {
          card_eyebrow: э.querySelector("#c-eye").value,
          card_title: э.querySelector("#c-title").value,
          card_lines: э.querySelector("#c-lines").value.split("\n")
                        .map(с => с.trim()).filter(Boolean),
          card_footer: э.querySelector("#c-foot").value,
        }});
      С = о.state; рисовать(); считать();
      сказать("💾 Сохранил");
      э.remove();
      открыть(о.post);
    } catch (e) {
      сказать(e.message, true);
      кнопка.disabled = false;
      кнопка.textContent = "💾 Сохранить";
    }
  };
}

async function каналы() {

        уйдёт первый пост.</div>`
      : `<div class="hint">Канал переключает владелец.</div>`}`);

  э.querySelectorAll("[data-канал]").forEach(б => б.onclick = async () => {
    const вид = б.dataset["канал"];
    if (вид === "основной") {
      const да = await новый_вопрос("Посты пойдут в основной канал. Уверены?");

    </div>`).join("") : `<div class="card muted">Пока никого, кроме вас.</div>`;

  const э = лист(`
    <div class="lbl">Кто может пользоваться</div>
    ${люди}
    <div id="код"></div>
    ${д.owner ? `
      <button class="btn primary wide" id="d-code" style="margin-top:.75rem">🔑 Создать приглашение</button>
      <div class="hint">Код действует сутки и срабатывает один раз. Отправьте
        его человеку, он пришлёт код боту в личку и окажется внутри. Свой id
        человеку узнавать не нужно.</div>
      <div class="hint">Роль «публикует» это те же права, что у вас, кроме
        настроек. Роль «готовит» сочиняет и правит, но в канал не отправляет.
        О каждой чужой публикации вам придёт уведомление.</div>` : ""}`);

  э.querySelectorAll("[data-роль]").forEach(с => с.onchange = async () => {
    тук();
    try {
      await зов("/api/access/role", {id: +с.dataset["роль"], role: с.value});
      сказать(с.value === "готовит" ? "Теперь только готовит посты"
                                    : "Может публиковать");
    } catch (e) { сказать(e.message, true); }
  });
  э.querySelectorAll("[data-убрать]").forEach(б => б.onclick = async () => {
    тук("medium");
    try {
      await зов("/api/access/remove", {id: +б.dataset["убрать"]});
      сказать("Убрал");
      э.remove(); доступ();
    } catch (e) { сказать(e.message, true); }
  });

  const создать = э.querySelector("#d-code");
  if (создать) создать.onclick = async () => {
    тук("medium");
    создать.disabled = true;
    try {
      const {code} = await зов("/api/access/code");
      э.querySelector("#код").innerHTML = `
        <div class="card" style="margin-top:.75rem;text-align:center">
          <div class="hint" style="margin:0 0 .375rem">Код приглашения</div>
          <div style="font-size:1.75rem;font-weight:700;letter-spacing:.28em;
                      color:var(--accent);font-family:ui-monospace,Menlo,monospace">${code}</div>
        </div>`;
      navigator.clipboard?.writeText(code).then(() => сказать("Код скопирован"),
                                                () => сказать("Код готов"));
    } catch (e) { сказать(e.message, true); }
    создать.disabled = false;
  };
}

// ── анонс стрима ──────────────────────────────────────────────────────────
async function настройкиСтрима() {
  let н, правила = {rules: [], days: []};
  try {
    н = await зов("/api/stream");
    правила = await зов("/api/repeats");
  } catch (e) { return сказать(e.message, true); }
  const правило = (правила.rules || [])[0] || {вид: "анонс", день: 3, время: "19:00", включено: false};
  const площадки = н.площадки.map((п, и) => `
    <div class="plat">
      <div class="field"><label>Кнопка</label>
        <input type="text" data-поле="имя" data-и="${и}" value="${экр(п.имя)}"></div>
      <div class="field" style="margin:0"><label>Ссылка</label>
        <input type="url" data-поле="адрес" data-и="${и}" value="${экр(п.адрес)}"></div>
    </div>`).join("");

  const э = лист(`
    <div class="lbl">Текст анонса</div>
    <textarea id="s-text" style="min-height:12rem">${экр(н.текст)}</textarea>
    <div class="hint">Уходит в канал слово в слово каждый раз. Ссылку внутри
      текста пишут так: [Twitch](https://twitch.tv/…).</div>
    <div class="lbl">Афиша</div>
    <div class="field"><label>Надпись сверху</label>
      <input type="text" id="a-eye" value="${экр(н.афиша.надпись)}"></div>
    <div class="field"><label>Крупная надпись</label>
      <input type="text" id="a-title" value="${экр(н.афиша.заголовок)}"></div>
    <div class="field"><label>Строка под ней</label>
      <input type="text" id="a-sub" value="${экр(н.афиша.подзаголовок)}"></div>
    <div class="lbl">Площадки</div>
    ${площадки}
    <div class="lbl">Повторять анонс</div>
    <div class="row">
      <select id="п-день" style="flex:2">${
        (правила.days || []).map((д, и) =>
          `<option value="${и}"${и === (правило.день ?? 3) ? " selected" : ""}>${д}</option>`).join("")}</select>
      <input type="text" id="п-время" style="flex:1" value="${экр(правило.время || "19:00")}">
    </div>
    <label class="галка"><input type="checkbox" id="п-вкл"${правило.включено ? " checked" : ""}>
      Ставить автоматически</label>
    <div class="hint">Бот разложит ближайшие четыре повтора в отложенные
      телеграма. Они выйдут даже если мак и всё остальное выключено.</div>

    <button class="btn primary wide" id="s-save" style="margin-top:.75rem">💾 Сохранить навсегда</button>
    <div class="hint">Правка запомнится и будет применяться ко всем следующим анонсам.</div>`);

  э.querySelector("#s-save").onclick = async () => {
    тук("medium");
    const кнопка = э.querySelector("#s-save");
    кнопка.disabled = true; кнопка.textContent = "⏳ Перерисовываю афишу…";
    const площ = н.площадки.map((п, и) => ({...п}));
    э.querySelectorAll("[data-поле]").forEach(поле => {
      площ[+поле.dataset.и][поле.dataset.поле] = поле.value.trim();
    });
    try {
      await зов("/api/stream/save", {
        текст: э.querySelector("#s-text").value,
        площадки: площ,
        афиша: {надпись: э.querySelector("#a-eye").value,
                заголовок: э.querySelector("#a-title").value,
                подзаголовок: э.querySelector("#a-sub").value},
      });
      await зов("/api/repeats/save", {rules: [{
        вид: "анонс",
        день: +э.querySelector("#п-день").value,
        время: э.querySelector("#п-время").value.trim() || "19:00",
        включено: э.querySelector("#п-вкл").checked,
      }]});
      сказать("💾 Анонс запомнен");
      э.remove();
    } catch (e) {
      сказать(e.message, true);
      кнопка.disabled = false; кнопка.textContent = "💾 Сохранить навсегда";
    }
  };
}

// ── связка ────────────────────────────────────────────────────────────────
// ── связка ────────────────────────────────────────────────────────────────
function подвязать() {
  // Создание переехало в лист: на главном экране остаётся очередь, а не
  // форма, которую заполняют раз в день.
  const сз = document.getElementById("создать");
  if (сз) сз.onclick = () => { тук(); листСоздания(); };

  // Карточка очереди: переключить площадку, опубликовать, время, править.
  document.querySelectorAll("[data-куда][data-пост]").forEach(б => б.onclick = async () => {
    тук();
    try {
      const о = await зов("/api/where", {id: +б.dataset.пост, net: б.dataset.куда});
      const п = (С.drafts || []).find(x => x.id == б.dataset.пост);
      if (п) п.where = о.where;
      if (п) обновитьКарту(п);
    } catch (e) { сказать(e.message, true); }
  });

  document.querySelectorAll("[data-пуб]").forEach(б => б.onclick = async () => {
    const п = (С.drafts || []).find(x => x.id == б.dataset.пуб);
    if (!п) return;
    тук("medium");
    б.disabled = true; б.textContent = "⏳ Отправляю…";
    try {
      await довести(await зов("/api/publish", {id: п.id}));
      сказать("🚀 Опубликовано");
      С = await зов("/api/state"); рисовать(); считать();
    } catch (e) {
      сказать(e.message, true);
      б.disabled = false; б.textContent = кудаПодпись(п);
    }
  });

  document.querySelectorAll("[data-ещё]").forEach(б => б.onclick = () => {
    const п = (С.drafts || []).find(x => x.id == б.dataset.ещё);
    if (п) { тук(); открыть(п); }
  });

  const пч = document.getElementById("пачкой");
  if (пч) пч.onclick = () => { тук("medium"); листПачки(готовые(С.drafts)); };
  document.querySelectorAll("[data-карта] .верх").forEach(э => э.onclick = (с) => {
    if (с.target.closest("[data-куда]")) return;
    const ид = +э.closest("[data-карта]").dataset.карта;
    const п = (С.drafts || []).find(x => x.id == ид);
    if (п) { тук(); открыть(п); }
  });

  // Конвейер на вкладке «Ещё»: нажатие открывает лист площадки.
  document.querySelectorAll("[data-конвейер]").forEach(б => б.onclick = () => {
    тук(); листКонвейера(б.dataset.конвейер);
  });

  const н = document.getElementById("go-week");
  if (н) н.onclick = () => { тук(); планЛист(); };
  const уб = document.getElementById("go-clean");
  if (уб) уб.onclick = async () => {
    тук();
    уб.disabled = true; уб.textContent = "⏳ Убираю…";
    try {
      await довести(await зов("/api/cleanup", {}));
      сказать("🧹 Прибрался");
    } catch (e) { сказать(e.message, true); }
    уб.disabled = false; уб.textContent = "🧹 Прибраться";
  };

  const заметка = document.getElementById("заметка");
  const вкопилку = document.getElementById("в-копилку");
  if (вкопилку) вкопилку.onclick = async () => {
    const текст = (заметка.value || "").trim();
    if (!текст) return сказать("Напишите заметку", true);
    тук("medium");
    вкопилку.disabled = true;
    try {
      const о = await зов("/api/ideas/add", {text: текст});
      С = о.state || С;
      заметка.value = "";
      const обновлено = Object.entries(о.facts_updated || {});
      сказать(обновлено.length
        ? "📊 Обновил: " + обновлено.map(([и, з]) => `${и} ${з}`).join(", ")
        : "💡 В копилке");
      рисовать(); считать();
    } catch (e) { сказать(e.message, true); }
    вкопилку.disabled = false;
  };
  document.querySelectorAll("[data-идея]").forEach(б => б.onclick = () => {
    тук(); листСоздания((С.ideas || []).find(и => и.id == б.dataset.идея)?.text || "");
  });
  document.querySelectorAll("[data-убрать-идею]").forEach(б => б.onclick = async () => {
    тук();
    try {
      const о = await зов("/api/ideas/drop", {id: +б.dataset.убратьИдея});
      С.ideas = о.ideas; рисовать();
    } catch (e) { сказать(e.message, true); }
  });

  document.querySelectorAll("[data-open]").forEach(б => б.onclick = () => {
    const все = [...(С.schedule || []), ...(С.history || []), ...(С.drafts || [])];
    const п = все.find(x => x.id == б.dataset.open);
    if (п) { тук(); открыть(п); }
  });
  const п = document.getElementById("поиск");
  if (п) п.oninput = () => { искомое = п.value; };
}

// Лист создания: тип поста, рубрика и тема. Открывается кнопкой, а не висит
// на главном экране.
function листСоздания(тема_ = "") {
  тема = тема_;
  const чипы = ["Сам выберу", ...С.rubrics].map(и => {
    const знач = и === "Сам выберу" ? "" : и;
    return `<button class="chip${(рубрика || "") === знач ? " on" : ""}"
              data-rub="${знач}">${Заглавная(и)}</button>`;
  }).join("");
  const э = лист(`
    <div class="lbl">Что делаем</div>
    <div class="row">
      <button class="btn primary" data-вид="post">✍️ Пост</button>
      <button class="btn" data-вид="carousel">🎠 Карусель</button>
    </div>
    <div class="row" style="margin-top:.375rem">
      <button class="btn ghost" data-вид="stream">🔴 Анонс стрима</button>
    </div>
    <div class="lbl">О чём</div>
    <div class="chips">${чипы}</div>
    <div style="height:.625rem"></div>
    <input type="text" id="тема" placeholder="Своя тема или ссылка на статью"
           value="${экр(тема)}">
    <div class="hint">Можно кинуть ссылку: бот откроет страницу, прочитает и
      перескажет суть своими словами.</div>`);
  э.querySelectorAll("[data-rub]").forEach(б => б.onclick = () => {
    тук(); рубрика = б.dataset.rub || null;
    э.querySelectorAll("[data-rub]").forEach(д => д.classList.remove("on"));
    б.classList.add("on");
  });
  const поле = э.querySelector("#тема");
  if (поле) поле.oninput = () => { тема = поле.value; };
  э.querySelectorAll("[data-вид]").forEach(б => б.onclick = async () => {
    тук("medium");
    э.remove();
    await сочинить(б.dataset.вид);
  });
}

// Лист площадки конвейера: включить, режим, часы.
function листКонвейера(код) {
  const п = (С.pipeline || []).find(x => x.код === код);
  if (!п) return;
  const э = лист(`
    <div class="lbl">${экр(п.имя)}</div>
    <button class="btn wide ${п.вкл ? "primary" : ""}" data-пер="auto">
      ${п.вкл ? "🤖 Сочиняет сам" : "💤 Спит"}</button>
    <div style="height:.375rem"></div>
    <button class="btn wide" data-пер="mode">
      ${п.режим === "сам" ? "🚀 Публикует сам" : "✋ Готовит, публикуете вы"}</button>
    <div class="hint">Выходит в ${п.часы.join(", ")}. Держу готовыми
      ${п.запас}, сейчас ${п.готово}. Часы и глубину плана меняйте в чате бота.</div>`);
  э.querySelectorAll("[data-пер]").forEach(б => б.onclick = async () => {
    тук("medium");
    try {
      const о = await зов("/api/pipeline", {net: код, what: б.dataset.пер});
      С.pipeline = о.pipeline;
      э.remove(); рисовать();
    } catch (e) { сказать(e.message, true); }
  });
}

function считать() {
  // На «Очереди» — сколько постов ждут одобрения, на «Плане» — сколько
  // стоит в расписании. Раньше на очереди висел счётчик расписания, и цифра
  // ноль рядом с четырьмя черновиками читалась как ошибка.
  const пары = [["cnt", (С.drafts || []).length],
                ["cnt2", (С.schedule || []).length]];
  for (const [ид, н] of пары) {
    const д = document.getElementById(ид);
    д.textContent = н;
    д.hidden = !н;
  }
  const ч = document.getElementById("ch");
  ч.textContent = С.channel || "канал не задан";
  ч.classList.toggle("main", С.channels?.["выбран"] === "основной");
  const жив = С.mac?.alive;
  const м = document.getElementById("mac");
  м.innerHTML = жив ? '💻<span class="слово"> мак на связи</span>'
                    : '💤<span class="слово"> мак спит</span>';
  м.classList.toggle("off", !жив);
  м.title = жив ? "Мак включён, всё доступно"
                : "Мак выключен. Сочинять и публиковать нельзя: "
                  + "сессия аккаунта лежит на нём";
  const к = document.getElementById("звук");
  к.textContent = С.silent ? "🔕" : "🔔";
  к.classList.toggle("off", !!С.silent);
  к.title = С.silent ? "Все посты уходят без звука" : "Посты со звуком, ночью тихо";
}

document.querySelectorAll(".tabs button").forEach(б => б.onclick = () => {
  тук(); вкладка = б.dataset.tab; рисовать();
});
document.getElementById("gear").onclick = () => { тук(); настройки(); };
document.getElementById("ch").onclick = () => { тук(); каналы(); };
document.getElementById("звук").onclick = async () => {
  тук("medium");
  try {
    const о = await зов("/api/sound");
    С = о.state; считать();
    сказать(о.silent ? "🔕 Посты уходят без звука"
                     : "🔔 Звук включён, ночью всё равно тихо");
  } catch (e) { сказать(e.message, true); }
};

(async () => {
  try {
    С = await зов("/api/state");
    считать(); рисовать();
  } catch (e) {
    document.getElementById("view").innerHTML =
      `<div class="empty"><b>Не пускает</b>${экр(e.message)}</div>`;
  }
})();
</script>
