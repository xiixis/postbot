<meta charset="utf-8"><style>
/* Шрифты лежат в проекте, а не тянутся из интернета: на сервере каждая
   загрузка это секунды, а без сети карточка вообще осталась бы без шрифта.
   Заголовочный Onest выбран за кириллицу: у прежнего Bricolage её нет, и
   русские заголовки рисовались чем придётся, по-разному на разных машинах. */
@font-face{font-family:Onest;font-weight:800;font-display:block;
  src:url('file://{{АССЕТЫ}}/fonts/onest-800-cyrillic.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Onest;font-weight:800;font-display:block;
  src:url('file://{{АССЕТЫ}}/fonts/onest-800-latin.woff2') format('woff2')}
@font-face{font-family:Plex;font-weight:400;font-display:block;
  src:url('file://{{АССЕТЫ}}/fonts/plex-400-cyrillic.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Plex;font-weight:400;font-display:block;
  src:url('file://{{АССЕТЫ}}/fonts/plex-400-latin.woff2') format('woff2')}
@font-face{font-family:Plex;font-weight:600;font-display:block;
  src:url('file://{{АССЕТЫ}}/fonts/plex-600-cyrillic.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Plex;font-weight:600;font-display:block;
  src:url('file://{{АССЕТЫ}}/fonts/plex-600-latin.woff2') format('woff2')}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1440px;overflow:hidden}
body{background:#F1F3EA;color:#12130F;font-family:Plex,-apple-system,sans-serif;
  position:relative;display:flex;flex-direction:column;
  padding:150px 80px 320px}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(199,226,75,.03) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(199,226,75,.03) 1px,transparent 1px);
  background-size:54px 54px}
/* Счётчика слайдов нет намеренно: TikTok, телеграм и остальные рисуют свой
   поверх картинки, и два счётчика рядом выглядят как ошибка вёрстки. */
.полоса{position:absolute;left:0;bottom:176px;height:6px;background:#C7E24B;
  box-shadow:0 0 26px rgba(199,226,75,.45)}
.знак{position:absolute;left:80px;bottom:205px;height:44px;
  filter:brightness(.5) saturate(1.4) drop-shadow(0 4px 14px rgba(0,0,0,.28))}

.шапка{font-family:Onest,sans-serif;font-weight:800;font-size:130px;
  line-height:1.08;letter-spacing:-.02em;color:#12130F;max-width:920px}
.мысль{font-size:55px;line-height:1.38;color:#3C4235;max-width:28ch}
/* Плашка-маркер. Раньше жила только в вёрстке «выделение», и на всей
   карусели акцент занимал около процента площади при норме 4-6. Тонкая
   цветная надпись площади не даёт: с расстояния ленты её не видно.
   Заливка видна. */
.свет{color:#12130F;background:#C7E24B;padding:.04em .18em;border-radius:3px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:800}
.черта{width:240px;height:4px;background:#C7E24B;margin:38px 0 30px}
/* Правило одно на весь файл. Второе такое же жило в другом блоке CSS, и
   правки в одном месте молча не работали: слайды с котом слушались одного
   определения, без кота другого, и текст при листании прыгал. */
.стек{margin:0 0 auto;position:relative;padding-top:170px}

.огонь{font-family:Onest,sans-serif;font-weight:800;font-size:598px;
  line-height:.9;color:#C7E24B;letter-spacing:-.04em;
  text-shadow:0 0 90px rgba(199,226,75,.32)}

.пара{display:flex;flex-direction:column;gap:26px}
.полка{border-left:5px solid #CBCFBE;padding-left:26px}

.полка.в .к{color:#C7E24B}
.полка .з{font-family:Onest,sans-serif;font-weight:800;

ul.пункты{list-style:none;display:flex;flex-direction:column;gap:24px}
ul.пункты li{display:flex;gap:20px;align-items:flex-start;
  font-size:58px;line-height:1.32;color:#12130F}
ul.пункты b{color:#C7E24B;font-weight:800;flex:0 0 auto;line-height:1}

.реплика{font-family:Onest,sans-serif;font-weight:800;font-size:162px;
  line-height:1.16;color:#12130F;position:relative;padding-left:.62em}
/* Кавычка стоит слева в поле, а не над первой буквой: наезжая на неё, она
   читалась как часть слова. */
.лапки{position:absolute;left:-.08em;top:-.16em;
  color:#C7E24B;opacity:.3;line-height:1}

.кружок{width:334px;height:334px;border-radius:50%;border:5px solid #C7E24B;

.зачерк{font-family:Onest,sans-serif;font-weight:800;font-size:144px;

.верно span{color:#C7E24B}

.верно span.свет{color:#12130F}

.бары{display:flex;flex-direction:column;gap:22px}
.бары{gap:30px}

.бар .л{height:30px;border-radius:6px;background:#CBCFBE}

.окно{background:#1B1E17;border:1px solid #CBCFBE;border-radius:16px;

.лента-время{position:relative;padding-left:38px}
