<!doctype html>
<!-- Картинка к посту в Telegram о ролике r12, 1280×720. В посте ссылки на пять сайтов, поэтому на
     картинке сами сайты знаками и кадр ролика; фраза не повторяет пост. Снимается Chrome без окна. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'Unbounded'; font-weight: 800; src: url('../../../public/plugins/fonts/Unbounded-cyrillic.woff2') format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Unbounded'; font-weight: 800; src: url('../../../public/plugins/fonts/Unbounded-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
@font-face { font-family: 'Onest'; font-weight: 400 800; src: url('../../../public/plugins/fonts/Onest-cyrillic.woff2') format('woff2'); unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
@font-face { font-family: 'Onest'; font-weight: 400 800; src: url('../../../public/plugins/fonts/Onest-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+2000-206F; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
body { position: relative; background: #0A0B08; color: #F1F2EA; font-family: 'Onest', sans-serif; letter-spacing: -0.02em; }
.glow { position: absolute; left: 700px; top: -200px; width: 900px; height: 900px; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(217, 160, 87, 0.5), rgba(160, 84, 40, 0.22) 50%, rgba(160, 84, 40, 0) 72%); }
.logo { position: absolute; left: 64px; top: 56px; width: 76px; height: 76px; border-radius: 22px; background: #12130F;
  border: 2px solid rgba(241, 242, 234, 0.16); display: grid; place-items: center; }
.logo img { width: 50px; }
h1 { position: absolute; left: 60px; top: 180px; margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 74px;
  line-height: 1.04; letter-spacing: -0.05em; text-transform: uppercase; }
h1 span { color: #C7E24B; }
.sub { position: absolute; left: 64px; top: 380px; width: 560px; font-size: 32px; line-height: 1.3; font-weight: 500; color: rgba(241, 242, 234, 0.78); }
.chips { position: absolute; left: 64px; top: 560px; display: flex; gap: 14px; }
.chip { width: 84px; height: 84px; border-radius: 24px; background: rgba(241, 242, 234, 0.94); display: grid; place-items: center; }
.chip img { width: 56px; height: 56px; object-fit: contain; border-radius: 12px; }
.phone { position: absolute; left: 700px; top: 60px; width: 320px; height: 600px; border-radius: 52px; overflow: hidden;
  border: 4px solid rgba(241, 242, 234, 0.22); box-shadow: 0 50px 110px rgba(0, 0, 0, 0.6); transform: rotate(-5deg); background: #0A0B08; }
.phone img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.cat { position: absolute; left: 930px; top: 300px; width: 330px; filter: drop-shadow(0 26px 34px rgba(0, 0, 0, 0.55)); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="phone"><img src="кадр.jpg"></div>
<div class="logo"><img src="../../../public/plugins/logo.png"></div>
<h1>Материалы<br><span>бесплатно</span></h1>
<div class="sub">Музыка, цвет, анимации и иконки, которые можно в коммерцию</div>
<div class="chips">
  <div class="chip"><img src="../../../public/sites/mixkit-icon.png"></div>
  <div class="chip"><img src="../../../public/sites/freshluts-icon.png"></div>
  <div class="chip"><img src="../../../public/sites/lottiefiles.png"></div>
  <div class="chip"><img src="../../../public/sites/phosphor.png"></div>
  <div class="chip"><img src="../../../public/sites/reactbits.png"></div>
</div>
<img class="cat" src="../../../public/sites/cat-chest.png">
</body>
</html>
